function computeVolumeRatio(snaps){
  // Use pre-computed vol_ratio from snapshot if available (same source as dashboard)

  // Fallback: compute from raw volume

  const avg=snaps.slice(1,21).reduce((s,r)=>s+(r.volume||0),0)/20;
  return avg>0?N(v/avg,2):null;
}
function computeRankChange(snaps){

  const now=snaps[0]?.rs_rank;
  const prev=snaps.find((s,i)=>i>=4&&s.rs_rank)?.rs_rank;
  return(now&&prev)?prev-now:null;
}
// ── XIRR solver (Newton-Raphson) ─────────────────────────────────────────────
function solveXIRR(cashFlows, dates) {
  if (cashFlows.length < 2) return null;
  if ((dates[dates.length-1] - dates[0]) / 86400000 < 1) return null;
  let g = 0.1;
  for (let i = 0; i < 200; i++) {
    let npv = 0, dnpv = 0;
    for (let j = 0; j < cashFlows.length; j++) {
      const yf = (dates[j] - dates[0]) / (1000*60*60*24*365);
      const f  = Math.pow(1 + g, yf);
      npv  += cashFlows[j] / f;
      dnpv += -yf * cashFlows[j] / f / (1 + g);
    }
    if (Math.abs(dnpv) < 1e-10) break;
    const next = g - npv / dnpv;
    if (Math.abs(next - g) < 0.000001) return next * 100;
    g = isFinite(next) ? next : 0.1;
  }
  return null;
}

// ── Total XIRR for deep dive (all buys/sells + current value) ─────────────────
function computeTotalXIRR(ticker, currentValue, txns) {
  try {
    const filtered = (txns || [])
      .filter(t => t.ticker === ticker && (t.type === 'BUY' || t.type === 'SELL'))
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    if (filtered.length === 0 || currentValue <= 0) return null;
    const cf = [], dt = [];
    filtered.forEach(t => {
      cf.push(t.type === 'BUY' ? -(t.quantity * t.price) : +(t.quantity * t.price));
      dt.push(new Date(t.date));
    });
    cf.push(currentValue);
    dt.push(new Date());
    return solveXIRR(cf, dt);
  } catch(e) { return null; }
}

  const ys=new Date().getFullYear()+'-01-01';
  const ytdS=[...snaps].reverse().find(x=>x.snapshot_date<ys);
  return{'1W':r(5),'1M':r(21),'3M':r(63),'6M':r(126),'YTD':ytdS?.close?N((cmp-ytdS.close)/ytdS.close*100,1):null,'1Y':r(252)};
}

// ── Conviction Score ─────────────────────────────────────────────────────────
function computeConvictionScore(latest, fund, volRatio, sc) {
  const breakdown = [];
  let score = 0;

  const add = (label, pts, max, detail) => {
    score += pts;
    breakdown.push({label, pts, max, detail});
  };

  // 1. RS Rank (20 pts)
  const rank = latest.rs_rank;
  if (rank) {
    const pts = rank <= 50 ? 20 : rank <= 125 ? 15 : rank <= 250 ? 8 : 2;
    add('RS Rank', pts, 20, '#' + rank);
  } else add('RS Rank', 0, 20, '—');

  // 2. Blue Zone Daily RS (15 pts)
  const rsD = latest.alkalyme_rs;
  const pts2 = !rsD ? 0 : rsD >= 72 ? 15 : rsD >= 65 ? 10 : rsD >= 55 ? 5 : 0;
  add('Blue Zone', pts2, 15, rsD ? N(rsD,1) : '—');

  // 3. EMA Stack (15 pts)
  const cmp = latest.close;
  const emaBull = cmp && latest.ema_20 && latest.ema_50 && latest.ema_200
    && cmp > latest.ema_20 && latest.ema_20 > latest.ema_50 && latest.ema_50 > latest.ema_200;
  const above200 = cmp && latest.ema_200 && cmp > latest.ema_200;
  const pts3 = emaBull ? 15 : above200 ? 7 : 0;
  add('EMA Stack', pts3, 15, emaBull ? 'Fully Bullish' : above200 ? 'Above 200' : 'Below 200');

  // 4. Distance from 52W High (12 pts)
  const dist = latest.high_52w && cmp ? (cmp - latest.high_52w) / latest.high_52w * 100 : null;
  const pts4 = dist == null ? 0 : dist >= -3 ? 12 : dist >= -10 ? 8 : dist >= -20 ? 4 : 0;
  add('52W High', pts4, 12, dist != null ? N(dist,1)+'%' : '—');

  // 5. Volume Ratio (8 pts)
  const pts5 = !volRatio ? 0 : volRatio >= 2 ? 8 : volRatio >= 1.5 ? 5 : volRatio >= 1 ? 3 : 0;
  add('Vol Ratio', pts5, 8, volRatio ? volRatio+'x' : '—');

  // 6. Revenue Growth YoY (7 pts)
  // 6. Revenue Growth YoY — quarterly_financials first (most current after Screener run)
  // Falls back to revenue_growth_yoy from yfinance (decimal ratio → always * 100)
  let revGrowth = null;
  if (fund?.quarterly_financials) {
    try {
      const qr = typeof fund.quarterly_financials === 'string'
          ? JSON.parse(fund.quarterly_financials) : fund.quarterly_financials;
      const rev0 = qr[0]?.revenue_cr ?? qr[0]?.revenue;
      const rev4 = qr[4]?.revenue_cr ?? qr[4]?.revenue;
      if (rev0 != null && rev4 != null && rev4 !== 0)
        revGrowth = (rev0 - rev4) / Math.abs(rev4) * 100;
    } catch(e) {}
  }
  if (revGrowth == null && fund?.revenue_growth_yoy != null)
    revGrowth = fund.revenue_growth_yoy * 100;
  const pts6 = revGrowth == null ? 0 : revGrowth >= 20 ? 7 : revGrowth >= 10 ? 5 : revGrowth >= 0 ? 2 : 0;
  add('Rev Growth', pts6, 7, revGrowth != null ? (revGrowth >= 0 ? '+' : '') + N(revGrowth,1) + '%' : '—');

  // 7. EPS Growth YoY — quarterly_financials first (most current)
  let epsGrowth = null;
  if (fund?.quarterly_financials) {
    try {
      const qe = typeof fund.quarterly_financials === 'string'
          ? JSON.parse(fund.quarterly_financials) : fund.quarterly_financials;
      if (qe.length >= 5 && qe[0]?.eps && qe[4]?.eps && qe[4].eps !== 0)
        epsGrowth = (qe[0].eps - qe[4].eps) / Math.abs(qe[4].eps) * 100;
    } catch(e) {}
  }
  if (epsGrowth == null && fund?.earnings_growth_yoy != null)
    epsGrowth = fund.earnings_growth_yoy * 100;
  const pts7 = epsGrowth == null ? 0 : epsGrowth >= 20 ? 7 : epsGrowth >= 10 ? 5 : epsGrowth >= 0 ? 2 : 0;
  add('EPS Growth', pts7, 7, epsGrowth != null ? (epsGrowth >= 0 ? '+' : '') + N(epsGrowth,1) + '%' : '—');

  // 8. ROE + ROCE — sector-relative (6 pts)
  const roePct  = fund?.sector_pct_roe;
  const rocePct = fund?.sector_pct_roce;
  let pts8 = 0;
  let roeLabel = '—';
  if (roePct != null || rocePct != null) {
    const avgPct = (roePct != null && rocePct != null)
        ? (roePct + rocePct) / 2
        : (roePct ?? rocePct);
    pts8     = avgPct >= 75 ? 6 : avgPct >= 50 ? 3 : 0;
    roeLabel = 'Sector top ' + Math.round(100 - avgPct) + '%';
  } else {
    const roe  = fund?.roe  != null ? (fund.roe  < 1 ? fund.roe  * 100 : fund.roe)  : null;
    const roce = fund?.roce != null ? fund.roce : null;
    if (roe != null || roce != null) {
      const maxVal = Math.max(roe || 0, roce || 0);
      pts8     = (roe >= 20 && roce >= 20) ? 6 : maxVal >= 20 ? 4 : maxVal >= 10 ? 2 : 0;
      roeLabel = roe != null ? 'ROE ' + N(roe,0) + '%' : 'ROCE ' + N(roce,0) + '%';
    }
  }
  add('ROE/ROCE', pts8, 6, roeLabel);

  // 9. Sector RRG Quadrant (5 pts)
  const rrg = sc?.rrg_quadrant;
  const pts9 = rrg === 'leading' ? 5 : rrg === 'improving' ? 3 : rrg === 'weakening' ? 1 : 0;
  add('Sector', pts9, 5, rrg ? rrg.charAt(0).toUpperCase() + rrg.slice(1) : '—');

  // 10. Stock vs Sector percentile (5 pts) — from daily_stock_snapshots (same source as dashboard)
  const pct = latest?.sector_percentile ?? sc?.stock_sector_percentile;
  const pts10 = !pct ? 0 : pct <= 10 ? 5 : pct <= 25 ? 3 : pct <= 50 ? 1 : 0;
  add('RS in Sector', pts10, 5, pct ? 'Top ' + pct + '%' : '—');

  const grade = score >= 80 ? 'A' : score >= 60 ? 'B' : score >= 40 ? 'C' : 'D';
  const gradeColor = score >= 80 ? '#3fb950' : score >= 60 ? '#58a6ff' : score >= 40 ? '#e3b341' : '#f85149';
  return { score, grade, gradeColor, breakdown };
}

async function render(ticker,d){
  const{live,snaps,fund,signals,holding,allHoldings,sector:sc}=d;
  const latest=snaps[0]||{};
  const cmp=live?.price||latest.close||0;
  const volRatio=computeVolumeRatio(snaps);
  const rankChg=computeRankChange(snaps);

  // Portfolio weight — fetch live prices for all holdings to get accurate current-value weight
  let portfolioWeight = null, portfolioValue = null, portfolioCost = null, portfolioPnl = null;
  if (holding && cmp && allHoldings.length) {
    const thisValue = holding.quantity * cmp;
    const thisCost  = holding.quantity * holding.avg_cost;

    // Fetch live prices for all holdings in one query
    const allTickers = allHoldings.map(h => h.ticker);
    const { data: livePrices } = await sb.from('live_prices')
      .select('ticker, price')
      .in('ticker', allTickers);
    const priceMap = {};
    (livePrices || []).forEach(r => { priceMap[r.ticker] = r.price; });

    // Total portfolio value using live prices, fallback to avg_cost
    const totalValue = allHoldings.reduce((sum, h) => {
      const p = priceMap[h.ticker] || h.avg_cost;
      return sum + (h.quantity * p);
    }, 0);

    portfolioValue  = thisValue;
    portfolioCost   = thisCost;
    portfolioPnl    = thisValue - thisCost;
    portfolioWeight = totalValue > 0 ? (thisValue / totalValue * 100) : null;
  }

  // Conviction score
  const conviction = computeConvictionScore(latest, fund, volRatio, sc);
  const dist52w=latest.high_52w&&cmp?N((cmp-latest.high_52w)/latest.high_52w*100,1):null;
  const athDist=fund?.ath_price&&cmp?N((cmp-fund.ath_price)/fund.ath_price*100,1):null;

  // Blue Zone — all conditions must pass (mirrors scanner logic)
  const rsD  = latest.rsi_ema_9||latest.alkalyme_rs;
  const rsW  = latest.weekly_rsi_ema_9||latest.weekly_rsi_14;
  const aboveEma20  = cmp && latest.ema_20  && cmp > latest.ema_20;
  const within52w   = cmp && latest.high_52w && cmp >= latest.high_52w * 0.90;
  const rsRankOk    = latest.rs_rank && latest.rs_rank <= 125;
  const bzStrong = rsRankOk && rsD>=72 && rsW>=65 && aboveEma20 && within52w && (latest.vol_ratio==null||latest.vol_ratio>=1.5);
  const bzBuy   = rsRankOk && rsD>=65 && rsW>=55 && aboveEma20 && within52w;
  const bzSignal = bzStrong?'STRONG BUY':bzBuy?'BUY':null;

  // EMA
  const emaBull=cmp&&latest.ema_20&&latest.ema_50&&latest.ema_200&&cmp>latest.ema_20&&latest.ema_20>latest.ema_50&&latest.ema_50>latest.ema_200;
  const emaBear=cmp&&latest.ema_20&&latest.ema_50&&latest.ema_200&&cmp<latest.ema_20&&latest.ema_20<latest.ema_50&&latest.ema_50<latest.ema_200;

  const snapR=computeReturns(snaps,cmp);
  const returns={
    '1W':fund?.return_1w??snapR['1W'],
    '1M':fund?.return_1m??snapR['1M'],
    '3M':fund?.return_3m??snapR['3M'],
    '6M':fund?.return_6m??snapR['6M'],
    'YTD':fund?.return_ytd??snapR['YTD'],
    '1Y':fund?.return_1y??snapR['1Y'],
  };

  // Fetch transactions for Total XIRR
  // Note: use ticker param (e.g. AMBER.NS), not nse which is outer scope
  const xirr_ticker = ticker.endsWith('.NS') ? ticker : ticker + '.NS';
  let totalXIRR = null;
  try {
    const {data: txnData} = await sb.from('transactions')
      .select('ticker, date, type, quantity, price')
      .eq('ticker', xirr_ticker)
      .in('type', ['BUY', 'SELL'])
      .order('date', {ascending: true});
    if (txnData && txnData.length > 0) {
      const totalBought = txnData.filter(t=>t.type==='BUY').reduce((s,t)=>s+parseFloat(t.quantity),0);
      const totalSold   = txnData.filter(t=>t.type==='SELL').reduce((s,t)=>s+parseFloat(t.quantity),0);
      const currentQty  = totalBought - totalSold;
      const currentVal  = currentQty > 0 ? cmp * currentQty : 0;
      const normalised  = txnData.map(t=>({...t, quantity:parseFloat(t.quantity), price:parseFloat(t.price)}));
      totalXIRR = computeTotalXIRR(xirr_ticker, currentVal, normalised);
    }
  } catch(e) { console.warn('XIRR fetch error:', e); }

  const badges=[];
  if(emaBull)badges.push('<span class="badge badge-green">STRONG UPTREND</span>');
  else if(emaBear)badges.push('<span class="badge badge-red">DOWNTREND</span>');
  if(bzSignal)badges.push(`<span class="badge badge-blue">BZ: ${bzSignal}</span>`);
  if(latest.rs_rank)badges.push(`<span class="badge badge-orange">Rank #${latest.rs_rank}${rankChg!=null?` <span class="${rankChg>0?'green':'red'}">${rankChg>0?'↑':'↓'}${Math.abs(rankChg)}</span>`:''}</span>`);
  if(holding)badges.push('<span class="badge badge-yellow">★ PORTFOLIO</span>');
  // Conviction badge
  badges.push(`<span class="badge" style="background:${conviction.gradeColor}20;color:${conviction.gradeColor};border:1px solid ${conviction.gradeColor}40" title="Conviction Score: ${conviction.score}/100">
    ⚡ ${conviction.score}/100 · Grade ${conviction.grade}
  </span>`);

  let quarterly=[];try{quarterly=JSON.parse(fund?.quarterly_financials||'[]');}catch(e){}

  document.title=`${ticker.replace('.NS','')} — Deep Dive`;

  document.getElementById('root').innerHTML=`
  <div class="header">
    <div>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span class="ticker-big">${ticker.replace('.NS','')}</span>
        <span style="color:var(--text2);font-size:13px">${fund?.stock_name||holding?.name||''}</span>
        ${fund?.sector?`<span class="badge badge-blue" style="font-size:11px">${fund.sector}</span>`:''}
        ${fund?.market_cap_cr?`<span style="color:var(--text2);font-size:12px">Mcap: ${fmtCr(fund.market_cap_cr)}</span>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${badges.join('')}</div>
    </div>
    <div style="display:flex;align-items:center;gap:20px">
      <div style="text-align:right">
        <div class="price-big ${live?.day_change>=0?'green':'red'}">₹${fmt(cmp,cmp>100?2:4)}</div>
        <div style="font-size:13px;margin-top:2px" class="${live?.day_change>=0?'green':'red'}">
          ${live?.day_change!=null?`${live.day_change>=0?'+':''}₹${fmt(Math.abs(live.day_change),2)} (${live.day_change_pct?.toFixed(2)}%)`:''}
        </div>
      </div>
      <a class="btn-chart" href="https://www.tradingview.com/chart/?symbol=NSE:${(()=>{ const m={'M&M':'M_M','KPENERGY':'KPEL','DENTAWATER':'DENTA','TRIL':'TARIL'}; const c=ticker.replace('.NS','').replace('.BO',''); return m[c]||c; })()}" target="_blank">↗ Chart</a>
    </div>
  </div>

  <div class="page">
    <!-- Portfolio Weight Strip (only shown for held stocks) -->
    ${holding && portfolioWeight != null ? `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Portfolio Weight</div>
        <div style="font-size:22px;font-weight:700">${N(portfolioWeight,2)}%</div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Quantity</div>
        <div style="font-size:16px;font-weight:700">${holding.quantity.toLocaleString('en-IN')}</div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Avg Cost</div>
        <div style="font-size:16px;font-weight:700">₹${fmt(holding.avg_cost,2)}</div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Current Value</div>
        <div style="font-size:16px;font-weight:700">₹${fmt(portfolioValue,0)}</div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Unrealized P&L</div>
        <div style="font-size:16px;font-weight:700;color:${portfolioPnl>=0?'var(--green)':'var(--red)'}">
          ${portfolioPnl>=0?'+':''}₹${fmt(Math.abs(portfolioPnl),0)}
          <span style="font-size:12px;margin-left:4px">(${portfolioPnl>=0?'+':''}${N((portfolioPnl/portfolioCost)*100,1)}%)</span>
        </div>
      </div>
      <div style="margin-left:auto">
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Conviction</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:28px;font-weight:800;color:${conviction.gradeColor}">${conviction.grade}</div>
          <div>
            <div style="font-size:14px;font-weight:700">${conviction.score}/100</div>
            <div style="width:80px;height:4px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden">
              <div style="width:${conviction.score}%;height:100%;background:${conviction.gradeColor};border-radius:2px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>` : ''}

    <!-- Conviction Score — shown for ALL stocks -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div>
        <div style="font-size:10px;color:var(--text2);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Conviction Score</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:32px;font-weight:800;color:${conviction.gradeColor}">${conviction.grade}</div>
          <div>
            <div style="font-size:16px;font-weight:700">${conviction.score}/100</div>
            <div style="width:120px;height:5px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden">
              <div style="width:${conviction.score}%;height:100%;background:${conviction.gradeColor};border-radius:2px"></div>
            </div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${conviction.breakdown.map(b=>`
        <div style="text-align:center;padding:8px 12px;background:var(--bg3);border-radius:6px;min-width:70px">
          <div style="font-size:10px;color:var(--text2);margin-bottom:3px">${b.label}</div>
          <div style="font-size:14px;font-weight:700;color:${b.pts===b.max?'var(--green)':b.pts>0?'var(--blue)':'var(--text2)'}">${b.pts}/${b.max}</div>
          <div style="font-size:10px;color:var(--text2);margin-top:2px">${b.detail}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- Returns -->
    <div class="returns-row">
      ${Object.entries(returns).map(([l,v])=>`
      <div class="ret-cell">
        <div class="ret-label">${l}</div>
        <div class="ret-val ${col(v)}">${v!=null?(v>=0?'+':'')+v+'%':'<span class="na">—</span>'}</div>
      </div>`).join('')}
      ${totalXIRR != null && isFinite(totalXIRR) ? `
      <div class="ret-cell" title="Annualised return across all transactions including sells">
        <div class="ret-label">Total XIRR</div>
        <div class="ret-val ${totalXIRR >= 0 ? 'green' : 'red'}">${totalXIRR >= 0 ? '+' : ''}${totalXIRR.toFixed(1)}%</div>
      </div>` : ''}
    </div>

    <!-- Technical row 1: RS Daily, RS Weekly, Rank, Blue Zone -->
    <div class="grid4">
      <div class="card">
        <div class="card-title">📈 RSI EMA(9)</div>
        <div class="card-value ${(latest.rsi_ema_9||0)>=65?'green':(latest.rsi_ema_9||0)>=50?'blue':'red'}">${latest.rsi_ema_9?N(latest.rsi_ema_9,1):'<span class="na">—</span>'}</div>
        <div class="card-sub">Daily price momentum</div>
        <div style="margin-top:8px;font-size:11px;color:var(--text2)">Alkalyme RS: <span style="color:var(--text);font-weight:600">${latest.alkalyme_rs?N(latest.alkalyme_rs,1):'—'}</span></div>
      </div>
      <div class="card">
        <div class="card-title">📊 Weekly RSI EMA(9)</div>
        <div class="card-value ${(rsW||0)>=65?'green':(rsW||0)>=55?'blue':'red'}">${rsW?N(rsW,1):'<span class="na">—</span>'}</div>
        <div class="card-sub">Weekly price momentum</div>
        <div style="margin-top:8px">
          <span style="font-size:11px;padding:2px 8px;border-radius:4px;${bzSignal?`background:${bzStrong?'#10b98130':'#3b82f630'};color:${bzStrong?'#10b981':'#58a6ff'}`:'background:#30363d;color:#8b949e'}">
            ${bzSignal?'BZ: '+bzSignal:'BZ: NO'}
          </span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🏆 RANK</div>
        <div class="card-value blue">${latest.rs_rank?'#'+latest.rs_rank:'<span class="na">—</span>'}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          ${rankChg!=null?`<span class="${rankChg>0?'green':'red'}" style="font-size:13px;font-weight:600">${rankChg>0?'↑':'↓'}${Math.abs(rankChg)}</span><span style="color:var(--text2);font-size:11px">in 5 days</span>`:'<span style="color:var(--text2);font-size:11px">No change data</span>'}
        </div>
        <div class="card-sub">Top ${latest.rs_rank?Math.round(latest.rs_rank/5.2):'—'}% of Nifty 500</div>
      </div>
      <div class="card">
        <div class="card-title">🔵 BLUE ZONE${bzStrong?' · STRONG BUY':bzBuy?' · BUY':''}</div>
        <div class="card-value ${bzSignal?'green':'text2'}" style="font-size:${bzStrong?'16px':'22px'};display:flex;align-items:center;gap:8px">
          ${bzSignal||'NO'} ${bzSignal?'<span style="font-size:18px">✅</span>':''}
        </div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">D: <b class="${(rsD||0)>=65?'green':'red'}">${rsD?N(rsD,1):'—'}</b></span>
          <span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">W: <b class="${(rsW||0)>=55?'green':'red'}">${rsW?N(rsW,1):'—'}</b></span>
          <span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">EMA20: <b class="${aboveEma20?'green':'red'}">${aboveEma20?'✓':'✗'}</b></span>
          <span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">52W: <b class="${within52w?'green':'red'}">${within52w?'✓':'✗'}</b></span>
          <span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">Rank: <b class="${rsRankOk?'green':'red'}">${latest.rs_rank?'#'+latest.rs_rank:'—'}</b></span>
          ${(()=>{
            const ema9  = latest.ema_9;
            const atr   = latest.atr_14;
            if (!ema9 || !atr || !cmp) return '';
            const dist  = cmp - ema9;
            const atrMult = dist / atr;
            const color = atrMult <= 0.5 ? '#10b981' : atrMult <= 1.0 ? '#f59e0b' : '#ef4444';
            const label = atrMult <= 0.5 ? '✓ Near EMA9' : atrMult <= 1.0 ? '~ Extended' : '✗ Overextended';
            return '<span style="font-size:11px;background:var(--bg3);padding:3px 8px;border-radius:4px">EMA9: <b style="color:' + color + '" title="' + atrMult.toFixed(2) + 'x ATR from EMA9">' + label + ' (' + atrMult.toFixed(1) + '×ATR)</b></span>';
          })()}
        </div>
      </div>
    </div>

    <!-- Technical row 2: EMA Stack, 52W, Vol Ratio, ATH -->
    <div class="grid4">
      <div class="card">
        <div class="card-title">📐 EMA STACK</div>
        ${latest.ema_20&&latest.ema_50&&latest.ema_200?`
        <div class="ema-display">
          <span style="color:${cmp>latest.ema_20?'var(--green)':'var(--red)'}">20</span>
          <span class="ema-op">${latest.ema_20>latest.ema_50?'>':'<'}</span>
          <span style="color:${latest.ema_20>latest.ema_50?'var(--green)':'var(--red)'}">50</span>
          <span class="ema-op">${latest.ema_50>latest.ema_200?'>':'<'}</span>
          <span style="color:${latest.ema_50>latest.ema_200?'var(--green)':'var(--red)'}">200</span>
        </div>
        <div class="card-sub" style="margin-top:8px">${emaBull?'🟢 Fully Bullish':emaBear?'🔴 Fully Bearish':'🟡 Mixed'}</div>
        `:'<div class="card-value na">—</div>'}
      </div>
      <div class="card">
        <div class="card-title">📏 DIST FROM 52W HIGH</div>
        <div class="card-value ${dist52w!=null&&dist52w>=-5?'green':'red'}">${dist52w!=null?dist52w+'%':'<span class="na">—</span>'}</div>
        <div class="card-sub">52W High: ₹${latest.high_52w?fmt(latest.high_52w,0):'—'}</div>
      </div>
      <div class="card">
        <div class="card-title">📊 VOLUME RATIO</div>
        <div class="card-value ${(volRatio||0)>=1.5?'green':(volRatio||0)>=1?'blue':'red'}">${volRatio!=null?volRatio+'x':'<span class="na">—</span>'}</div>
        <div class="card-sub">vs 20-day avg</div>
      </div>
      <div class="card">
        <div class="card-title">🏔️ ALL-TIME HIGH</div>
        <div class="card-value">₹${fund?.ath_price?fmt(fund.ath_price,0):'<span class="na">—</span>'}</div>
        <div class="card-sub ${athDist!=null?(athDist>=-5?'green':'red'):''}">
          ${athDist!=null?athDist+'% from ATH':''}
          ${fund?.ath_date?`<br>${fund.ath_date}`:fund?'<br>Run fetcher':''}
        </div>
      </div>
    </div>

    <!-- RS History Chart + Signal Timeline -->
    <div class="grid2">
      <div class="card">
        <div class="card-title">📈 RS HISTORY (ALKALYME)</div>
        <div class="chart-wrap"><canvas id="rsChart"></canvas></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="card-title" style="margin-bottom:0">⏱️ SIGNAL TIMELINE</div>
          <span style="color:var(--text2);font-size:11px">${signals.length} signals</span>
        </div>
        ${signals.length?`
        <div class="signal-list">
          ${signals.map(s=>`
          <div class="signal-item">
            <span class="signal-date">${s.alert_date||''}</span>
            <span class="signal-tag" style="${sigSt(s.signal_type)}">${sigLb(s.signal_type)}</span>
            <span class="signal-price">${s.price?'₹'+fmt(s.price,0):''}</span>
          </div>`).join('')}
        </div>`:'<div class="text2" style="text-align:center;padding:20px">No signals yet</div>'}
      </div>
    </div>

    <!-- Key Price Levels + Fundamentals -->
    <div class="grid2">
      <div class="card">
        <div class="card-title">📌 KEY PRICE LEVELS</div>
        ${[
          ['ATH',fund?.ath_price,athDist,false],
          ['52W High',latest.high_52w,dist52w,false],
          ['CMP',cmp,null,true],
          ['EMA 20',latest.ema_20,latest.ema_20?N((cmp-latest.ema_20)/latest.ema_20*100,1):null,false],
          ['EMA 50',latest.ema_50,latest.ema_50?N((cmp-latest.ema_50)/latest.ema_50*100,1):null,false],
          ['EMA 200',latest.ema_200,latest.ema_200?N((cmp-latest.ema_200)/latest.ema_200*100,1):null,false],
        ].filter(([,v])=>v!=null&&v>0).map(([lb,v,chg,cur])=>`
        <div class="price-level">
          <span class="pl-label">${lb}${cur?'<span class="curr-badge" style="margin-left:6px">CURRENT</span>':''}</span>
          <span class="pl-right">
            <span class="pl-val ${cur?'blue':''}">₹${fmt(v,v>100?0:2)}</span>
            ${chg!=null?`<span class="pl-pct ${parseFloat(chg)>=0?'green':'red'}">${parseFloat(chg)>=0?'+':''}${chg}%</span>`:''}
          </span>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">🏦 FUNDAMENTALS ${!fund?'<span style="font-size:10px;color:var(--orange)">(Run fetcher)</span>':''}</div>
        <div class="metric-grid2">
          ${[
            ['PE (TTM)',fund?.pe_ttm!=null?(N(fund.pe_ttm,1)+sectorRankBadge(fund?.sector_pct_pe)):null],
            ['PE 3Y Avg',fund?.pe_3yr_avg!=null?N(fund.pe_3yr_avg,1):null],
            ['P/Book',fund?.price_to_book?N(fund.price_to_book,2)+'x':null],
            ['P/Sales',fund?.price_to_sales?N(fund.price_to_sales,2)+'x':null],
            ['EV/EBITDA',fund?.ev_to_ebitda?N(fund.ev_to_ebitda,1)+'x':null],
            ['ROE',fund?.roe!=null?(N(fund.roe*(fund.roe<1?100:1),1)+'%'+sectorRankBadge(fund?.sector_pct_roe)):null],
            ['ROCE',fund?.roce!=null?(N(fund.roce,1)+'%'+sectorRankBadge(fund?.sector_pct_roce)):null],
            ['Debt/Eq',fund?.debt_to_equity!=null?(N(fund.debt_to_equity,2)+sectorRankBadge(fund?.sector_pct_debt_equity)):null],
            ['Net Margin',fund?.net_margin!=null?(N(fund.net_margin*(fund.net_margin<1?100:1),1)+'%'+sectorRankBadge(fund?.sector_pct_net_margin)):null],
            ['EBITDA Margin',fund?.ebitda_margin!=null?(N(fund.ebitda_margin*(fund.ebitda_margin<1?100:1),1)+'%'+sectorRankBadge(fund?.sector_pct_ebitda_margin)):null],
            ['EPS (TTM)',fund?.eps_ttm!=null?'₹'+N(fund.eps_ttm,2):null],

async function main(){
  const ticker=getTicker();
  if(!ticker){document.getElementById('root').innerHTML='<div class="loading"><div>No ticker. Use ?ticker=SYRMA.NS</div></div>';return;}
  const nse=ticker.endsWith('.NS')?ticker:ticker+'.NS';
  try{const data=await fetchAll(nse);render(nse,data);}
  catch(e){document.getElementById('root').innerHTML=`<div class="loading" style="color:var(--red)">Error: ${e.message}</div>`;console.error(e);}
}
main();

<script>
let _searchData = null;
let _searchIdx = -1;

async function openStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'block';
    document.getElementById('stockSearchModal').style.display = 'block';
    const inp = document.getElementById('stockSearchInput');
    inp.value = '';
    document.getElementById('stockSearchResults').innerHTML = '';
    inp.focus();
    if (!_searchData) {
        const { data } = await sb.from('indian_stock_sectors')
            .select('ticker, company_name, sector')
            .order('ticker');
        _searchData = data || [];
    }
}

function closeStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'none';
    document.getElementById('stockSearchModal').style.display = 'none';
    _searchIdx = -1;
}

function handleStockSearch(q) {
    _searchIdx = -1;
    const box = document.getElementById('stockSearchResults');
    if (!q || q.length < 1) { box.innerHTML = ''; return; }
    const ql = q.toLowerCase();
    const results = (_searchData || []).filter(s =>
        s.ticker?.toLowerCase().includes(ql) ||
        s.company_name?.toLowerCase().includes(ql)
    ).slice(0, 10);

    if (!results.length) {
        box.innerHTML = '<div style="padding:12px;color:#8b949e;font-size:13px">No results found</div>';
        return;
    }
    box.innerHTML = results.map((s, i) => {
        const tick = s.ticker.replace('.NS','').replace('.BO','');
        const hl = (txt) => txt.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
            '<mark style="background:#58a6ff30;color:#58a6ff;border-radius:2px">$1</mark>');
        return `<div class="search-result-item" data-ticker="${s.ticker}" data-idx="${i}"
            onclick="goToDeepDive('${s.ticker}')"
            onmouseenter="setSearchIdx(${i})"
            style="padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;
                   align-items:center;justify-content:space-between;gap:10px;transition:background 0.1s">
            <div>
                <span style="font-weight:700;font-size:14px;color:#e6edf3">${hl(tick)}</span>
                <span style="color:#8b949e;font-size:12px;margin-left:8px">${hl(s.company_name||'')}</span>
            </div>
            <span style="font-size:10px;color:#8b949e;white-space:nowrap;
                         background:#0d1117;padding:2px 8px;border-radius:10px">
                ${s.sector||''}
            </span>
        </div>`;
    }).join('');
}

function setSearchIdx(i) {
    _searchIdx = i;
    document.querySelectorAll('.search-result-item').forEach((el, j) => {
        el.style.background = j === i ? '#21262d' : '';
    });
}

function handleStockSearchKey(e) {
    const items = document.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        setSearchIdx(Math.min(_searchIdx + 1, items.length - 1));
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setSearchIdx(Math.max(_searchIdx - 1, 0));
    } else if (e.key === 'Enter') {
        if (_searchIdx >= 0 && items[_searchIdx]) {
            goToDeepDive(items[_searchIdx].dataset.ticker);
        } else if (items.length === 1) {
            goToDeepDive(items[0].dataset.ticker);
        }
    } else if (e.key === 'Escape') {
        closeStockSearch();
    }
}

function goToDeepDive(ticker) {
    closeStockSearch();
    // Navigate in same tab since we're already on deep dive
    window.location.href = `deep_dive.html?ticker=${encodeURIComponent(ticker)}`;
}

document.getElementById('stockSearchBtn').addEventListener('mouseenter', function(){ this.style.transform='scale(1.1)'; });
document.getElementById('stockSearchBtn').addEventListener('mouseleave', function(){ this.style.transform='scale(1)'; });
</script>

</body>
