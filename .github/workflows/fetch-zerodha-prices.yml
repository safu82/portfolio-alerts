    - cron: '0 9 * * 1-5'
    - cron: '5 9 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Call Zerodha Fetch Prices Edge Function
        run: |
          response=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://hcgyncghmcvylnrmcivj.supabase.co/functions/v1/zerodha-fetch-prices")
          
          echo "HTTP Status: $response"
          echo "Response:"
          cat response.json
          
          if [ "$response" != "200" ]; then
            echo "❌ Edge function returned non-200 status"
            exit 1
          fi
          
          echo "✅ Prices fetched successfully"
