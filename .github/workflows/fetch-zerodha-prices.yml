    - cron: '35 6 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '55 6 * * 1-5'
    - cron: '0 7 * * 1-5'
