name: Daily Portfolio Alerts

on:
  schedule:
    - cron: '7 14 * * 1-5'  # 7:37 PM IST (14:07 UTC), Mon–Fri only — off-hour to avoid cron delay
  workflow_dispatch:  # Allow manual trigger

jobs:
  scan-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase pandas numpy beautifulsoup4 requests python-dateutil anthropic

      - name: Delete old alerts (older than 5 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          from datetime import datetime, timedelta
          from supabase import create_client

          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
          cutoff_date = (datetime.now() - timedelta(days=5)).date().isoformat()

          result = supabase.table('alerts').delete().lt('alert_date', cutoff_date).execute()
          print(f'🗑️ Deleted alerts older than {cutoff_date}')
          "

      - name: Run alert scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python integrated_alert_scanner.py

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: scan-alerts
    if: always()
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.scan-alerts.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"; TITLE="Daily portfolio alerts OK"
          else
            EMOJI="❌"; TITLE="Daily portfolio alerts FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nstatus: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
