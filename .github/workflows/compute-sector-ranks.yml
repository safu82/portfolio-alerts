name: Compute Sector Fundamental Ranks

on:
  schedule:
    - cron: '30 5 * * 6'  # Saturday 11:00 AM IST (05:30 UTC) — after Screener scraper
  workflow_dispatch:

jobs:
  rank-fundamentals:
    name: Sector Percentile Rankings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install supabase

      - name: Run sector ranker
        run: python compute_sector_ranks.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
