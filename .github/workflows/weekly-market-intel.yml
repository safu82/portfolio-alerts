name: Weekly Market Intelligence Report

on:
  schedule:
    - cron: '30 11 * * 6'  # Sat 11:30 UTC = 17:00 IST (5 PM)
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write          # so the workflow can commit the generated reports back

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so we can push back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_market_intel.txt

      - name: Generate weekly report
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_market_intel.py

      - name: Commit reports back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No new report files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "Weekly market intel report — $DATE"
            git push
          fi
