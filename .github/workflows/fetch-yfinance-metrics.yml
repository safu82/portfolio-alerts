name: Fetch YFinance Metrics (ATH + Beta + Returns)

on:
  schedule:
    - cron: '9 13 * * 1-5'   # 6:39 PM IST (13:09 UTC), Mon-Fri — off-hour to avoid cron delay
                               # Runs after OHLC and scanner
  workflow_dispatch:           # Manual trigger anytime

jobs:
  fetch-yfinance:
    name: Fetch ATH, Beta, Market Cap, Returns
    runs-on: ubuntu-latest
    timeout-minutes: 20        # Should complete in ~5-8 min, kill if hanging

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy

      - name: Run fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_yfinance_metrics.py
