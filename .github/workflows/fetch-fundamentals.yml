name: Fetch Stock Fundamentals

on:
  schedule:
    - cron: '30 12 * * 1-5'   # 6:00 PM IST (12:30 UTC), Mon-Fri
  workflow_dispatch:            # manual trigger anytime

jobs:
  fetch-fundamentals:
    name: Fetch Fundamentals for Portfolio Holdings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy requests beautifulsoup4

      - name: Run Fundamentals Fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_stock_fundamentals.py
