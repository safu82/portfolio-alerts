name: Entry Signals Scanner

on:
  schedule:
    - cron: '0 11 * * *'  # 4:30 PM IST daily
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-ohlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy supabase
      - run: python PRODUCTION_fetch_ohlc_nifty500.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  scan-signals:
    runs-on: ubuntu-latest
    needs: fetch-ohlc
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy supabase
      - run: sleep 300  # Wait 5 minutes
      - run: python PRODUCTION_entry_signals_scanner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
