name: Fetch OHLC Data

on:
  schedule:
    - cron: '7 11 * * *'  # 4:37 PM IST (11:07 UTC) — off-hour to avoid cron delay
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-ohlc:
    name: Fetch Nifty 500 OHLC Data (Zerodha)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect pandas numpy supabase

      - name: Fetch OHLC Data from Zerodha
        run: python PRODUCTION_fetch_ohlc_with_rsi.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}

  rank-rs:
    name: Compute Alkalyme RS Rankings
    runs-on: ubuntu-latest
    needs: fetch-ohlc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install supabase

      - name: Run RS ranker
        run: python alkalyme_rs_ranker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: [fetch-ohlc, rank-rs]
    if: always()
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OHLC_STATUS: ${{ needs.fetch-ohlc.result }}
          RANK_STATUS: ${{ needs.rank-rs.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OHLC_STATUS" = "success" ] && [ "$RANK_STATUS" = "success" ]; then
            EMOJI="✅"; TITLE="OHLC fetch OK"
          else
            EMOJI="❌"; TITLE="OHLC fetch FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nfetch-ohlc: %s\nrank-rs: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$OHLC_STATUS" "$RANK_STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
