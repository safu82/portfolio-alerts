name: Fetch OHLC Data

on:
  schedule:
    - cron: '0 11 * * *'  # 4:30 PM IST (11:00 UTC)
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-ohlc:
    name: Fetch Nifty 500 OHLC Data (Zerodha)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect pandas numpy supabase

      - name: Fetch OHLC Data from Zerodha
        run: python PRODUCTION_fetch_ohlc_with_rsi.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}

  rank-rs:
    name: Compute Alkalyme RS Rankings
    runs-on: ubuntu-latest
    needs: fetch-ohlc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install supabase

      - name: Run RS ranker
        run: python alkalyme_rs_ranker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
