name: Scan Entry Signals
on:
  schedule:
   - cron: '13 14 * * *'  # 7:43 PM IST (14:13 UTC) — off-hour to avoid cron delay
  workflow_dispatch:  # Allow manual trigger
jobs:
  scan-signals:
    name: Scan for Entry Signals (Zerodha)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy supabase requests beautifulsoup4
      
      - name: Run Entry Signals Scanner
        run: python PRODUCTION_entry_signals_scanner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
