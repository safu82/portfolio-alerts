name: Paper Trading Executor

on:
  schedule:
    - cron: '30 16 * * 1-5'  # 22:00 IST (16:30 UTC), Mon-Fri
  workflow_dispatch:

jobs:
  paper-trade:
    name: Run Paper Trader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run Paper Trader
        run: python paper_trader.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: paper-trade
    if: always()
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.paper-trade.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"; TITLE="Paper trader OK"
          else
            EMOJI="❌"; TITLE="Paper trader FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nstatus: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
