name: Daily Zerodha Token Refresh

on:
  schedule:
    # 5:37 AM IST (00:07 UTC) every day — off-hour to avoid cron delay
    - cron: '7 0 * * *'
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager pyotp python-dotenv kiteconnect supabase

      - name: Run Zerodha token automation
        env:
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
          ZERODHA_API_SECRET: ${{ secrets.ZERODHA_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEADLESS: true
        run: |
          python zerodha_auto_token_with_supabase.py

      - name: Verify token was saved
        run: |
          if [ -f zerodha_access_token.txt ]; then
            echo "✅ Token file created successfully"
            echo "Token preview: $(head -c 20 zerodha_access_token.txt)..."
          else
            echo "❌ Token file not found - automation may have failed"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Token refresh failed!"
          echo "Please check the logs above and run manually if needed"
          echo "Manual command: python zerodha_auto_token_with_supabase.py"

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: refresh-token
    if: always()
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.refresh-token.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"; TITLE="Zerodha token refresh OK"
          else
            EMOJI="❌"; TITLE="Zerodha token refresh FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nstatus: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
