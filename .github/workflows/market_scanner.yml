name: Nifty 500 Market Scanner

on:
  schedule:
    - cron: '13 11 * * *'  # 4:43 PM IST (11:13 UTC) — off-hour to avoid cron delay
  workflow_dispatch:  # Allow manual runs

jobs:
  scan-market:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas supabase
      
      - name: Run market scanner
        run: |
          python market_scanner_nifty500.py
