            crudeInterpretation = `<b style="color: #22c55e;">🟢 Moderate Oil</b><br>Within normal range — neutral for Indian macro.`;
        } else {
            crudeInterpretation = `<b style="color: #3b82f6;">🔵 Low Oil</b><br>${crudePercentile}th percentile — favourable for India: lower import bill, eases inflation.`;
        }
        document.getElementById('crudeInterpretation').innerHTML = crudeInterpretation;
    }
    
    // Overall market regime analysis
    updateMarketRegime(latest, stats, historical);
}

function updateMarketRegime(latest, stats, historical) {
    if (!latest.gold_silver_ratio || !latest.india_vix || !latest.dxy) {
        document.getElementById('marketRegime').textContent = 'Loading...';
        document.getElementById('marketRegimeDescription').textContent = 'Analyzing market conditions...';
        return;
    }

    const gsPercentile  = getPercentileRank(latest.gold_silver_ratio, historical, 'gold_silver_ratio');
    const vixPercentile = getPercentileRank(latest.india_vix, historical, 'india_vix');
    const dxyPercentile = getPercentileRank(latest.dxy, historical, 'dxy');
    const crudePercentile = latest.crude_oil ? getPercentileRank(latest.crude_oil, historical, 'crude_oil') : 50;

    let regime = '';
    let description = '';
    let color = '';

    // Determine market regime based on combined signals
    if (vixPercentile >= 85 && dxyPercentile >= 80) {
        regime = '🚨 RISK-OFF: STRESS + STRONG USD';
        description = `VIX at ${vixPercentile}th percentile + DXY at ${dxyPercentile}th percentile. Classic FII exodus setup — high fear combined with strong dollar typically means sustained selling in Indian markets.`;
        color = 'linear-gradient(135deg, #dc2626 0%, #991b1b 100%)';
    } else if (vixPercentile >= 85) {
        regime = '🌊 HIGH VOLATILITY / FEAR';
        description = `VIX at ${vixPercentile}th percentile — elevated market stress. Turbulent conditions create opportunities but require patience. Use dips to accumulate quality names.`;
        color = 'linear-gradient(135deg, #ea580c 0%, #c2410c 100%)';
    } else if (dxyPercentile >= 80 && crudePercentile >= 75) {
        regime = '⚠️ MACRO HEADWINDS';
        description = `Strong USD (${dxyPercentile}th percentile) + high crude ($${latest.crude_oil?.toFixed(0) ?? '-'}). Double pressure on India — FII outflows likely and import bill elevated. Favour defensive sectors.`;
        color = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
    } else if (dxyPercentile <= 25 && vixPercentile <= 40) {
        regime = '💎 FAVOURABLE MACRO';
        description = `Weak USD (${dxyPercentile}th percentile) + calm markets (VIX: ${vixPercentile}th). Classic FII inflow environment — historically strong for Indian equities. Good risk/reward.`;
        color = 'linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%)';
    } else if (vixPercentile <= 30 && dxyPercentile <= 50) {
        regime = '🟢 CALM & CONSTRUCTIVE';
        description = `Low volatility (VIX: ${vixPercentile}th percentile) with neutral-to-weak USD. Supportive conditions for Indian markets. Stay invested, look for technical entry signals.`;
        color = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
    } else if (gsPercentile >= 80) {
        regime = '🥇 RISK-OFF: GOLD FLIGHT';
        description = `Gold/Silver ratio at ${gsPercentile}th percentile — investors fleeing to safe havens. Defensive positioning warranted. Watch for VIX pickup as confirmation.`;
        color = 'linear-gradient(135deg, #f59e0b 0%, #b45309 100%)';
    } else {
        regime = '🔵 MIXED / NEUTRAL';
        description = `VIX: ${vixPercentile}th percentile | DXY: ${dxyPercentile}th percentile | Gold/Silver: ${gsPercentile}th percentile. No extreme readings — normal market conditions. Follow individual stock signals.`;
        color = 'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)';
    }

    // Add Gold/Silver context if relevant
    if (gsPercentile <= 10) {
        description += ` Note: Gold/Silver ratio at historic lows (${gsPercentile}th percentile) - silver very expensive vs gold.`;
    } else if (gsPercentile >= 90) {
        description += ` Note: Gold/Silver ratio elevated (${gsPercentile}th percentile) - silver relatively cheap.`;
    }
    
    document.getElementById('marketRegime').textContent = regime;
    document.getElementById('marketRegimeDescription').textContent = description;
    document.getElementById('marketRegime').parentElement.style.background = color;
}

function toggleRatioCharts() {

function renderRatiosCharts(data) {

    // Use last 365 days for cleaner charts (instead of all 5 years)

<!-- ── Floating Stock Search ─────────────────────────────────────────── -->
<div id="stockSearchBtn" onclick="openStockSearch()" title="Search stocks"
    style="position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;
           background:var(--primary-color);color:white;display:flex;align-items:center;
           justify-content:center;font-size:22px;cursor:pointer;z-index:9999;
           box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:transform 0.15s">
    🔍
</div>

<div id="stockSearchOverlay" onclick="closeStockSearch()" 
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000"></div>

<div id="stockSearchModal"
    style="display:none;position:fixed;top:15%;left:50%;transform:translateX(-50%);
           width:min(560px,92vw);background:var(--bg-secondary);border:1px solid var(--border-color);
           border-radius:14px;z-index:10001;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;font-weight:600;letter-spacing:0.5px">
        STOCK DEEP DIVE SEARCH
    </div>
    <input id="stockSearchInput" type="text" placeholder="Type ticker or company name..."
        oninput="handleStockSearch(this.value)"
        onkeydown="handleStockSearchKey(event)"
        style="width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border-color);
               background:var(--bg-primary);color:var(--text-primary);font-size:15px;
               outline:none;box-sizing:border-box"/>
    <div id="stockSearchResults" style="margin-top:8px;max-height:320px;overflow-y:auto"></div>
</div>

<script>
let _searchData = null;
let _searchIdx = -1;

async function openStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'block';
    document.getElementById('stockSearchModal').style.display = 'block';
    const inp = document.getElementById('stockSearchInput');
    inp.value = '';
    document.getElementById('stockSearchResults').innerHTML = '';
    inp.focus();
    // Load data once
    if (!_searchData) {
        const { data } = await supabase.from('indian_stock_sectors')
            .select('ticker, company_name, sector')
            .order('ticker');
        _searchData = data || [];
    }
}

function closeStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'none';
    document.getElementById('stockSearchModal').style.display = 'none';
    _searchIdx = -1;
}

function handleStockSearch(q) {
    _searchIdx = -1;
    const box = document.getElementById('stockSearchResults');
    if (!q || q.length < 1) { box.innerHTML = ''; return; }
    const ql = q.toLowerCase();
    const results = (_searchData || []).filter(s =>
        s.ticker?.toLowerCase().includes(ql) ||
        s.company_name?.toLowerCase().includes(ql)
    ).slice(0, 10);

    if (!results.length) {
        box.innerHTML = '<div style="padding:12px;color:var(--text-secondary);font-size:13px">No results found</div>';
        return;
    }
    box.innerHTML = results.map((s, i) => {
        const tick = s.ticker.replace('.NS','').replace('.BO','');
        const hl = (txt) => txt.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
            '<mark style="background:#58a6ff30;color:#58a6ff;border-radius:2px">$1</mark>');
        return `<div class="search-result-item" data-ticker="${s.ticker}" data-idx="${i}"
            onclick="goToDeepDive('${s.ticker}')"
            onmouseenter="setSearchIdx(${i})"
            style="padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;
                   align-items:center;justify-content:space-between;gap:10px;
                   transition:background 0.1s">
            <div>
                <span style="font-weight:700;font-size:14px">${hl(tick)}</span>
                <span style="color:var(--text-secondary);font-size:12px;margin-left:8px">${hl(s.company_name||'')}</span>
            </div>
            <span style="font-size:10px;color:var(--text-secondary);white-space:nowrap;
                         background:var(--bg-primary);padding:2px 8px;border-radius:10px">
                ${s.sector||''}
            </span>
        </div>`;
    }).join('');
}

function setSearchIdx(i) {
    _searchIdx = i;
    document.querySelectorAll('.search-result-item').forEach((el, j) => {
        el.style.background = j === i ? 'var(--border-color)' : '';
    });
}

function handleStockSearchKey(e) {
    const items = document.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        setSearchIdx(Math.min(_searchIdx + 1, items.length - 1));
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setSearchIdx(Math.max(_searchIdx - 1, 0));
    } else if (e.key === 'Enter') {
        if (_searchIdx >= 0 && items[_searchIdx]) {
            goToDeepDive(items[_searchIdx].dataset.ticker);
        } else if (items.length === 1) {
            goToDeepDive(items[0].dataset.ticker);
        }
    } else if (e.key === 'Escape') {
        closeStockSearch();
    }
}

function goToDeepDive(ticker) {
    closeStockSearch();
    window.open(`deep_dive.html?ticker=${encodeURIComponent(ticker)}`, '_blank');
}

document.getElementById('stockSearchBtn').addEventListener('mouseenter', function(){ this.style.transform='scale(1.1)'; });
document.getElementById('stockSearchBtn').addEventListener('mouseleave', function(){ this.style.transform='scale(1)'; });
</script>
