<script>
(function() {
    var PASS_KEY = 'dashboard_auth_v2';
    var CORRECT  = 'khimani2026';
    if (localStorage.getItem(PASS_KEY) === CORRECT) return;

    document.addEventListener('DOMContentLoaded', function() {
        document.body.style.display = 'none';
        var gate = document.createElement('div');
        gate.id  = 'pw-gate';
        gate.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
        gate.innerHTML = '<div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px 48px;text-align:center;width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.4)">'
            + '<div style="font-size:28px;margin-bottom:8px">📊</div>'
            + '<div style="font-size:20px;font-weight:700;color:#e6edf3;margin-bottom:4px">Portfolio Dashboard</div>'
            + '<div style="font-size:13px;color:#8b949e;margin-bottom:28px">Enter password to continue</div>'
            + '<input id="pw-input" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:15px;outline:none;margin-bottom:12px;">'
            + '<button id="pw-btn" style="width:100%;padding:10px;border-radius:8px;border:none;background:#238636;color:white;font-size:15px;font-weight:600;cursor:pointer;">Unlock</button>'
            + '<div id="pw-err" style="display:none;margin-top:12px;font-size:13px;color:#f85149">Incorrect password</div>'
            + '</div>';
        document.body.parentNode.insertBefore(gate, document.body);

        function attempt() {
            var val = document.getElementById('pw-input').value;
            if (val === CORRECT) {
                localStorage.setItem(PASS_KEY, CORRECT);
                gate.remove();
                document.body.style.display = '';
            } else {
                document.getElementById('pw-err').style.display = 'block';
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        }
        document.getElementById('pw-btn').addEventListener('click', attempt);
        document.getElementById('pw-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') attempt();
        });
        setTimeout(function() { document.getElementById('pw-input').focus(); }, 100);
    });
})();
</script>

            quantity: s.quantity, avg_cost: s.avgCost, sector: s.sector

        // Only remove tickers no longer in portfolio if we have a full valid dataset
        // Guard: skip deletion if portfolioData looks incomplete (< 5 stocks)

        if (portfolioData.length >= 5) {

            const { data: existing } = await supabase.from('holdings')
                .select('ticker').eq('portfolio', 'INDIAN');

                if (toDelete.length > 0 && toDelete.length < 10) {
                    await supabase.from('holdings')
                        .delete()
                        .eq('portfolio', 'INDIAN')
                        .in('ticker', toDelete);
                } else if (toDelete.length >= 10) {
                    console.warn(`⚠️ Skipping suspicious bulk delete of ${toDelete.length} tickers`);

            }
        }
        return true;
    } catch (error) {
        console.error('❌ Error saving holdings:', error);
        return false;
    }
}

// ============ LIVE FIFO ENGINE ============
// Computes open lots, avg cost, realized P&L from the transactions table.
// Replaces hardcoded FIFO_AVG_COST, LOT_DETAILS_BY_TICKER, REALIZED_GAINS_BY_TICKER.

function computeFIFOFromTransactions(allTransactions) {
    const TODAY = new Date();
    const HOLD_THRESHOLD = 365; // days for LTCG

    // Group transactions by ticker, sorted chronologically
    const byTicker = {};
    allTransactions.forEach(t => {
        if (t.portfolio && t.portfolio !== 'INDIAN') return;
        if (!byTicker[t.ticker]) byTicker[t.ticker] = [];
        byTicker[t.ticker].push(t);
    });

    const fifoAvgCost = {};
    const lotDetailsByTicker = {};
    const realizedGainsByTicker = {};

    Object.entries(byTicker).forEach(([ticker, txns]) => {
        // Sort chronologically
        txns.sort((a, b) => new Date(a.date) - new Date(b.date));

        // FIFO queue: each entry = { date, qty, price, isBonusOrDiv }
        const queue = [];
        let realizedPL = 0;

        txns.forEach(t => {
            const qty = parseFloat(t.quantity);
            const price = parseFloat(t.price);
            const isBonusOrDiv = price < 1.0; // zero-cost bonus/dividend shares

            if (t.type === 'BUY') {
                queue.push({ date: t.date, qty, price: isBonusOrDiv ? 0 : price, isBonusOrDiv });
            } else if (t.type === 'SELL') {
                let remaining = qty;
                const proceeds = qty * price;
                let sellCost = 0;
                while (remaining > 0 && queue.length > 0) {
                    const lot = queue[0];
                    const use = Math.min(lot.qty, remaining);
                    sellCost += use * lot.price;
                    lot.qty -= use;
                    remaining -= use;
                    if (lot.qty <= 0) queue.shift();
                }
                realizedPL += proceeds - sellCost;
            }
        });

        realizedGainsByTicker[ticker] = realizedPL;

        // Open lots = what remains in the queue
        const openLots = queue.filter(l => l.qty > 0).map(l => {
            const buyDate = new Date(l.date);
            const daysHeld = Math.floor((TODAY - buyDate) / (1000 * 60 * 60 * 24));
            const taxStatus = daysHeld >= HOLD_THRESHOLD ? 'LTCG' : 'STCG';
            const cost = l.qty * l.price;
            return {
                date: l.date,
                type: l.isBonusOrDiv ? 'Bonus' : 'Buy',
                qty: l.qty,
                avgPrice: l.price,
                cost,
                taxStatus
            };
        });

        lotDetailsByTicker[ticker] = openLots;

        // Weighted avg cost across open lots
        const totalQty = openLots.reduce((s, l) => s + l.qty, 0);
        const totalCost = openLots.reduce((s, l) => s + l.cost, 0);
        fifoAvgCost[ticker] = totalQty > 0 ? totalCost / totalQty : 0;
    });

    console.log(`✅ FIFO engine computed for ${Object.keys(byTicker).length} tickers`);
    return { fifoAvgCost, lotDetailsByTicker, realizedGainsByTicker };
}

// Global FIFO results — populated on load, updated on new transaction
let FIFO_COMPUTED = { fifoAvgCost: {}, lotDetailsByTicker: {}, realizedGainsByTicker: {} };

// Helper: total realized = FIFO sell gains + lifetime dividends
function getTotalRealized(ticker) {
    const sellGains = FIFO_COMPUTED.realizedGainsByTicker[ticker] || 0;
    const dividends = LIFETIME_DIVIDENDS_BY_TICKER[ticker] || 0;
    return sellGains + dividends;
}

function getTotalRealizedAll() {
    const allTickers = new Set([
        ...Object.keys(FIFO_COMPUTED.realizedGainsByTicker),
        ...Object.keys(LIFETIME_DIVIDENDS_BY_TICKER)
    ]);
    let total = 0;
    allTickers.forEach(t => { total += getTotalRealized(t); });
    return total;
}

// NIFTYBEES month-end price lookup (keyed by YYYY-MM) — populated from Supabase at startup
const NIFTYBEES_MONTHLY = {};
let stockAlerts = {};
let sectorRankings = {};
let tickerSectorMap = {};
let stockFundamentals = {}; // keyed by ticker, loaded once on init

// ── SHARED CONVICTION SCORE ───────────────────────────────────────────────────
// Single source of truth. Always out of 100. Missing data = 0 points (not excluded).
// Grades: A ≥80, B ≥60, C ≥40, D <40
function getConvictionBadge(ticker) {
    const nsTicker = ticker.endsWith('.NS') ? ticker : ticker + '.NS';
    const cleanTicker = ticker.replace(/\.(NS|BO|BSE)$/i, '');
    const mappedTicker = { 'KPENERGY': 'KPEL', 'DENTAWATER': 'DENTA', 'TRIL': 'TARIL', 'M&M': 'M_M' }[cleanTicker] || cleanTicker;

    const ema   = stockEmaData[mappedTicker] || stockEmaData[cleanTicker] || stockEmaData[nsTicker];
    const fund  = stockFundamentals[nsTicker] || stockFundamentals[ticker];
    const price = ema?.close || prices[nsTicker]?.price || prices[ticker]?.price || 0;  // snapshot close preferred for consistency
    const sc    = sectorRankings[tickerSectorMap[nsTicker] || tickerSectorMap[cleanTicker]];

    let raw = 0;
    // Fixed max = 100. Missing data scores 0 — not excluded from denominator.

    // 1. RS Rank (20)
    const rank = ema?.rs_rank;
    if (rank) raw += rank <= 50 ? 20 : rank <= 125 ? 15 : rank <= 250 ? 8 : 2;

    // 2. Blue Zone / RS Daily (15)
    const rsD = ema?.alkalyme_rs;
    if (rsD) raw += rsD >= 72 ? 15 : rsD >= 65 ? 10 : rsD >= 55 ? 5 : 0;

    // 3. EMA Stack (15)
    if (ema?.ema_20 && ema?.ema_50 && ema?.ema_200 && price) {
        const bull = price > ema.ema_20 && ema.ema_20 > ema.ema_50 && ema.ema_50 > ema.ema_200;
        raw += bull ? 15 : price > ema.ema_200 ? 7 : 0;
    }

    // 4. Distance from 52W High (12)
    if (ema?.high_52w && price) {
        const d = (price - ema.high_52w) / ema.high_52w * 100;
        raw += d >= -3 ? 12 : d >= -10 ? 8 : d >= -20 ? 4 : 0;
    }

    // 5. Vol Ratio (8)
    if (ema?.vol_ratio != null) {
        raw += ema.vol_ratio >= 2 ? 8 : ema.vol_ratio >= 1.5 ? 5 : ema.vol_ratio >= 1 ? 3 : 0;
    }

    // 6. Revenue Growth YoY (7) — 0 if no data
    // 6. Revenue Growth YoY (7) — compute from quarterly_financials first (most current)
    // Falls back to revenue_growth_yoy from yfinance (stored as decimal ratio, always * 100)
    let revG = null;
    if (fund?.quarterly_financials) {
        try {
            const qr = typeof fund.quarterly_financials === 'string'
                ? JSON.parse(fund.quarterly_financials) : fund.quarterly_financials;
            const rev0 = qr[0]?.revenue_cr ?? qr[0]?.revenue;
            const rev4 = qr[4]?.revenue_cr ?? qr[4]?.revenue;
            if (rev0 != null && rev4 != null && rev4 !== 0)
                revG = (rev0 - rev4) / Math.abs(rev4) * 100;
        } catch(e) {}
    }
    if (revG == null && fund?.revenue_growth_yoy != null)
        revG = fund.revenue_growth_yoy * 100;  // yfinance stores as decimal ratio
    if (revG != null) raw += revG >= 20 ? 7 : revG >= 10 ? 5 : revG >= 0 ? 2 : 0;

    // 7. EPS Growth YoY (7) — compute from quarterly_financials first (most current)
    let epsG = null;
    if (fund?.quarterly_financials) {
        try {
            const qe = typeof fund.quarterly_financials === 'string'
                ? JSON.parse(fund.quarterly_financials) : fund.quarterly_financials;
            if (qe.length >= 5 && qe[0]?.eps && qe[4]?.eps && qe[4].eps !== 0)
                epsG = (qe[0].eps - qe[4].eps) / Math.abs(qe[4].eps) * 100;
        } catch(e) {}
    }
    if (epsG == null && fund?.earnings_growth_yoy != null)
        epsG = fund.earnings_growth_yoy * 100;  // yfinance stores as decimal ratio
    if (epsG != null) raw += epsG >= 20 ? 7 : epsG >= 10 ? 5 : epsG >= 0 ? 2 : 0;

    // 8. ROE / ROCE — sector-relative (6)
    if (fund) {
        const roePct  = fund.sector_pct_roe;
        const rocePct = fund.sector_pct_roce;
        if (roePct != null || rocePct != null) {
            const avgPct = (roePct != null && rocePct != null)
                ? (roePct + rocePct) / 2
                : (roePct ?? rocePct);
            raw += avgPct >= 75 ? 6 : avgPct >= 50 ? 3 : 0;
        } else {
            // Fallback to absolute values if sector pcts not yet computed
            const roe  = fund.roe  != null ? (fund.roe  < 1 ? fund.roe  * 100 : fund.roe) : null;
            const roce = fund.roce != null ? fund.roce : null;
            if (roe != null || roce != null) {
                const mx = Math.max(roe || 0, roce || 0);
                raw += (roe >= 20 && roce >= 20) ? 6 : mx >= 20 ? 4 : mx >= 10 ? 2 : 0;
            }
        }
    }

    // 9. Sector RRG Quadrant (5) — 0 if no data
    if (sc?.rrg_quadrant) raw += sc.rrg_quadrant === 'leading' ? 5 : sc.rrg_quadrant === 'improving' ? 3 : sc.rrg_quadrant === 'weakening' ? 1 : 0;

    // 10. In-Sector Percentile (5) — stored in daily_stock_snapshots by alkalyme_rs_ranker
    const pct = ema?.sector_percentile;
    if (pct != null) raw += pct <= 10 ? 5 : pct <= 25 ? 3 : pct <= 50 ? 1 : 0;


    // Fixed denominator of 100 — all 10 factors identical to deep dive
    const score = Math.min(100, raw);

        function calculateFloorPivots(high, low, close) {
            const PP = (high + low + close) / 3;
            
            return {
                PP: PP,
                R1: (2 * PP) - low,
                R2: PP + (high - low),
                R3: high + 2 * (PP - low),
                S1: (2 * PP) - high,
                S2: PP - (high - low),
                S3: low - 2 * (high - PP),
                // Mid-Pivots (between main levels)
                M1: ((2 * PP) - high + PP) / 2,  // Between S1 and PP
                M2: (PP + (2 * PP) - low) / 2,   // Between PP and R1
                M3: ((2 * PP) - low + PP + (high - low)) / 2,  // Between R1 and R2
                M4: ((2 * PP) - high + PP - (high - low)) / 2  // Between S1 and S2
            };
        }

        function calculateCamarilla(high, low, close) {
            const range = high - low;
            
            return {
                H4: close + (range * 1.1) / 2,
                H3: close + (range * 1.1) / 4,
                H2: close + (range * 1.1) / 6,
                H1: close + (range * 1.1) / 12,
                L1: close - (range * 1.1) / 12,
                L2: close - (range * 1.1) / 6,
                L3: close - (range * 1.1) / 4,
                L4: close - (range * 1.1) / 2
            };
        }

        function calculateCPR(high, low, close) {
            const PP = (high + low + close) / 3;
            const BC = (high + low) / 2;  // Bottom Central Pivot
            const TC = (PP - BC) + PP;     // Top Central Pivot
            
            return {
                PP: PP,
                TC: TC,
                BC: BC,
                width: TC - BC,
                widthPercent: ((TC - BC) / close) * 100  // CPR width as % of price
            };
        }

        function analyzePivotPosition(currentPrice, floor, camarilla, cpr) {

                if (currentPrice < floor.S2) {

                } else if (currentPrice < floor.S1) {
                    analysis.floor.zone = 'Between S1 and S2 - Weak';
                } else {
                    analysis.floor.zone = 'Between S1 and PP - Bearish';
                }
            } else {
                analysis.floor.bias = 'NEUTRAL';
                analysis.floor.position = 'At PP';
                analysis.floor.zone = 'At Pivot Point - Critical Level';
            }
            
            // Camarilla Analysis
            if (currentPrice >= camarilla.H3) {
                analysis.camarilla.zone = 'At/Above H3 - Reversal Zone';
                analysis.camarilla.signal = 'SELL SIGNAL (fade the rally)';
            } else if (currentPrice <= camarilla.L3) {
                analysis.camarilla.zone = 'At/Below L3 - Reversal Zone';
                analysis.camarilla.signal = 'BUY SIGNAL (buy the dip)';
            } else if (currentPrice > camarilla.H4) {
                analysis.camarilla.zone = 'Above H4 - Breakout!';
                analysis.camarilla.signal = 'STRONG BULLISH BREAKOUT';
            } else if (currentPrice < camarilla.L4) {
                analysis.camarilla.zone = 'Below L4 - Breakdown!';
                analysis.camarilla.signal = 'STRONG BEARISH BREAKDOWN';
            } else {
                analysis.camarilla.zone = 'Normal Range';
                analysis.camarilla.signal = 'No clear Camarilla signal';
            }
            
            // CPR Analysis
            if (currentPrice > cpr.TC) {
                analysis.cpr.position = 'Above CPR';
                analysis.cpr.bias = 'BULLISH';
            } else if (currentPrice < cpr.BC) {
                analysis.cpr.position = 'Below CPR';
                analysis.cpr.bias = 'BEARISH';
            } else {
                analysis.cpr.position = 'Inside CPR';
                analysis.cpr.bias = 'CONSOLIDATING';
            }
            
            // CPR Width Analysis (volatility forecast)
            if (cpr.widthPercent < 0.5) {
                analysis.cpr.forecast = '🚀 Narrow CPR - Explosive move expected';
            } else if (cpr.widthPercent > 1.5) {
                analysis.cpr.forecast = '〰️ Wide CPR - Range-bound day';
            } else {
                analysis.cpr.forecast = '📊 Normal CPR width';
            }
            
            // Find nearest pivot level
            const allLevels = [
                { name: 'R3', value: floor.R3, type: 'resistance' },
                { name: 'R2', value: floor.R2, type: 'resistance' },
                { name: 'R1', value: floor.R1, type: 'resistance' },

                { name: 'S1', value: floor.S1, type: 'support' },

                { name: 'S3', value: floor.S3, type: 'support' },
                { name: 'H3', value: camarilla.H3, type: 'camarilla-resistance' },
                { name: 'L3', value: camarilla.L3, type: 'camarilla-support' }
            ];
            
            let nearestDistance = Infinity;
            allLevels.forEach(level => {
                const distance = Math.abs(currentPrice - level.value);
                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    analysis.nearestLevel = {
                        ...level,
                        distance: distance,
                        distancePercent: (distance / currentPrice) * 100
                    };

            // Overall signal

                analysis.overall = 'NEUTRAL';
                analysis.signal = '⚖️ Mixed Signals';
            }
            
            return analysis;

        function findPivotHotZones(floor, camarilla, cpr, currentPrice) {
            const tolerance = currentPrice * 0.01; // 1% tolerance
            const hotZones = [];
            
            const allLevels = [
                { type: 'Floor PP', value: floor.PP },
                { type: 'Floor R1', value: floor.R1 },
                { type: 'Floor R2', value: floor.R2 },
                { type: 'Floor S1', value: floor.S1 },
                { type: 'Floor S2', value: floor.S2 },
                { type: 'Cam H3', value: camarilla.H3 },
                { type: 'Cam H2', value: camarilla.H2 },
                { type: 'Cam L3', value: camarilla.L3 },
                { type: 'Cam L2', value: camarilla.L2 },
                { type: 'CPR Top', value: cpr.TC },
                { type: 'CPR Bot', value: cpr.BC }
            ];
            
            // Find clusters of levels within tolerance
            const processed = new Set();
            
            for (let i = 0; i < allLevels.length; i++) {
                if (processed.has(i)) continue;
                
                const cluster = [allLevels[i]];
                processed.add(i);
                
                for (let j = i + 1; j < allLevels.length; j++) {
                    if (processed.has(j)) continue;
                    
                    if (Math.abs(allLevels[i].value - allLevels[j].value) <= tolerance) {
                        cluster.push(allLevels[j]);
                        processed.add(j);
                    }
                }
                
                if (cluster.length >= 2) {
                    const avgPrice = cluster.reduce((sum, l) => sum + l.value, 0) / cluster.length;
                    hotZones.push({
                        price: avgPrice,
                        levels: cluster.map(l => l.type),
                        strength: cluster.length,
                        distance: avgPrice - currentPrice,
                        distancePercent: ((avgPrice - currentPrice) / currentPrice) * 100
                    });
                }
            }
            
            // Sort by strength (most confluent first)
            return hotZones.sort((a, b) => b.strength - a.strength);
        }

        function calculatePivotSummary() {
            const summary = {
                total: 0,
                bullish: 0,
                bearish: 0,
                neutral: 0,
                narrowCPR: 0,
                reversalSignals: 0,
                hotZones: 0
            };
            
            if (Object.keys(pivotData).length === 0) {
                return summary;
            }
            
            portfolio.forEach(stock => {
                const ticker = stock.ticker;
                if (!pivotData[ticker] || !pivotData[ticker].analysis) return;
                
                summary.total++;
                
                const analysis = pivotData[ticker].analysis;
                const cpr = pivotData[ticker].cpr;
                
                // Count bias
                if (analysis.floor.bias === 'BULLISH') {
                    summary.bullish++;
                } else if (analysis.floor.bias === 'BEARISH') {
                    summary.bearish++;
                } else {
                    summary.neutral++;
                }
                
                // Count narrow CPR (< 0.5%)
                if (Math.abs(cpr.widthPercent) < 0.5) {
                    summary.narrowCPR++;
                }
                
                // Count reversal signals
                if (analysis.camarilla.signal.includes('SIGNAL')) {
                    summary.reversalSignals++;
                }
                
                // Count hot zones (3+ confluence)
                if (pivotData[ticker].hotZones && pivotData[ticker].hotZones.length > 0) {
                    if (pivotData[ticker].hotZones[0].strength >= 3) {
                        summary.hotZones++;
                    }
                }
            });
            
            summary.bullishPercent = summary.total > 0 ? (summary.bullish / summary.total) * 100 : 0;
            summary.bearishPercent = summary.total > 0 ? (summary.bearish / summary.total) * 100 : 0;
            
            return summary;
        }

                    const analysis = analyzePivotPosition(currentPrice, floor, camarilla, cpr);
                    const hotZones = findPivotHotZones(floor, camarilla, cpr, currentPrice);
                    
                    pivotData[ticker].analysis = analysis;
                    pivotData[ticker].hotZones = hotZones;
                    
                    // Add to table for display
                    pivotTable.push({
                        Stock: stock.name.substring(0, 15),
                        Price: `₹${currentPrice.toFixed(2)}`,
                        PP: `₹${floor.PP.toFixed(2)}`,

                        'CPR%': `${cpr.widthPercent.toFixed(2)}%`,
                        Signal: analysis.camarilla.signal.includes('SIGNAL') ? '🎯' :
                                cpr.widthPercent < 0.5 ? '🚀' :

        // Get IST time
        function getISTTime() {
            const now = new Date();
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utcTime + (5.5 * 3600000));
            return istTime;
        }

        // Format date as YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Check if it's a weekday (Mon-Fri)
        function isWeekday(date) {
            const day = date.getDay();
            return day >= 1 && day <= 5;
        }

        // Take daily snapshot at 3:40 PM IST
        function checkAndTakeSnapshot() {
            const istTime = getISTTime();
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const today = formatDate(istTime);
            
            // Check if it's 3:40 PM IST and a weekday
            if (hours === 15 && minutes === 40 && isWeekday(istTime)) {
                const snapshots = getSnapshots();
                
                // Only take snapshot once per day
                if (!snapshots[today]) {
                    const metrics = calculateMetrics();
                    const psi = calculatePortfolioStrengthIndex();
                    saveSnapshot(today, metrics.totalCurrentValue, psi.score);
                }
            }
        }

        function getLastDayOfPreviousMonth() {
            const istTime = getISTTime();
            const firstDayOfCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
            const lastDayOfPrevMonth = new Date(firstDayOfCurrentMonth - 1);
            return formatDate(lastDayOfPrevMonth);
        }

        // Get Dec 31 of previous year
        function getLastDayOfPreviousYear() {
            const istTime = getISTTime();
            const year = new Date().getFullYear();
            return `${year - 1}-12-31`;
        }

        // Get period start value for current month
        function getPeriodStartValue() {
            const snapshots = getSnapshots();
            const lastMonthEnd = getLastDayOfPreviousMonth();
            
            // Try to get last month's end value from snapshots
            if (snapshots[lastMonthEnd]) {
                return snapshots[lastMonthEnd];
            }
            
            // If not found, look backwards up to 5 days (for weekends/holidays)
            for (let i = 1; i <= 5; i++) {
                const date = new Date(lastMonthEnd);
                date.setDate(date.getDate() - i);
                const checkDate = formatDate(date);
                if (snapshots[checkDate]) {
                    console.log(`⚠️ Using snapshot from ${checkDate} (closest to month end)`);
                    return snapshots[checkDate];
                }
            }
            
            // Fallback to Sept 30 value if no snapshot found
            return 104476994.42;
        }

        // Get YTD start value (Dec 31 of previous year)
        function getYTDStartValue() {
            const snapshots = getSnapshots();
            const istTime = getISTTime();
            const currentYear = new Date().getFullYear();
            
            // For 2025, we don't have Dec 31, 2024 data

            if (currentYear === 2025) {
                // Return Sept 30 value, we'll handle Jan-Sep separately
                return 104476994.42;
            }
            
            const lastYearEnd = `${currentYear - 1}-12-31`;
            
            if (snapshots[lastYearEnd]) {
                return snapshots[lastYearEnd];
            }
            
            // Look backwards up to 5 days
            for (let i = 1; i <= 5; i++) {
                const date = new Date(lastYearEnd);
                date.setDate(date.getDate() - i);
                const checkDate = formatDate(date);
                if (snapshots[checkDate]) {
                    return snapshots[checkDate];
                }
            }
            
            // Fallback
            return 104476994.42;
        }

                    return; // Skip if no EMA data at all
                }
                
                const currentPrice = prices[holding.ticker]?.price || holding.avgCost;
                
                // Check bullish and bearish stacks (only if ALL EMAs are available)
                if (emaData.ema_20 && emaData.ema_50 && emaData.ema_200) {
                    // Bullish stack: Price > 20 > 50 > 200
                    if (currentPrice > emaData.ema_20 && emaData.ema_20 > emaData.ema_50 && emaData.ema_50 > emaData.ema_200) {
                        bullishStackedCount++;
                    }
                    // Bearish stack: 200 > 50 > 20 > Price
                    else if (emaData.ema_200 > emaData.ema_50 && emaData.ema_50 > emaData.ema_20 && emaData.ema_20 > currentPrice) {
                        bearishStackedCount++;
                    }
                }
                
                // Check individual EMAs (only if that EMA exists)
                if (emaData.ema_20 !== null && emaData.ema_20 !== undefined) {
                    above20Total++;
                    if (currentPrice > emaData.ema_20) above20++;
                }
                
                if (emaData.ema_50 !== null && emaData.ema_50 !== undefined) {
                    above50Total++;
                    if (currentPrice > emaData.ema_50) above50++;
                }
                
                if (emaData.ema_200 !== null && emaData.ema_200 !== undefined) {
                    above200Total++;
                    if (currentPrice > emaData.ema_200) above200++;
                }
            });
            
            // Log missing stocks
            if (missingEmaData.length > 0) {
                missingEmaData.forEach(stock => {
                    console.log(`  - ${stock.name} (${stock.ticker}) [Clean: ${stock.cleanTicker}] [Mapped: ${stock.mappedTicker}]`);
                });
            }
            
            return {
                total: totalStocks,
                bullishStacked: bullishStackedCount,
                bullishStackedPercent: totalStocks > 0 ? (bullishStackedCount / totalStocks * 100) : 0,
                bearishStacked: bearishStackedCount,
                bearishStackedPercent: totalStocks > 0 ? (bearishStackedCount / totalStocks * 100) : 0,
                above20: above20,
                above20Total: above20Total,
                above20Percent: above20Total > 0 ? (above20 / above20Total * 100) : 0,
                above50: above50,
                above50Total: above50Total,
                above50Percent: above50Total > 0 ? (above50 / above50Total * 100) : 0,
                above200: above200,
                above200Total: above200Total,
                above200Percent: above200Total > 0 ? (above200 / above200Total * 100) : 0,
                missingCount: missingEmaData.length
            };
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            render();
        }

        function getSortedPortfolio() {
            if (!sortColumn) return [...portfolio].sort((a, b) => a.name.localeCompare(b.name));

            return [...portfolio].sort((a, b) => {
                let aVal, bVal;
                
                const currentPriceA = prices[a.ticker]?.price || 0;
                const currentPriceB = prices[b.ticker]?.price || 0;
                
                switch(sortColumn) {
                    case 'name':
                        aVal = a.name;
                        bVal = b.name;
                        break;
                    case 'quantity':
                        aVal = a.quantity;
                        bVal = b.quantity;
                        break;
                    case 'avgCost':
                        aVal = a.avgCost;
                        bVal = b.avgCost;
                        break;
                    case 'costValue':
                        aVal = a.quantity * a.avgCost;
                        bVal = b.quantity * b.avgCost;
                        break;
                    case 'currentPrice':
                        aVal = currentPriceA;
                        bVal = currentPriceB;
                        break;
                    case 'priceChange':
                        aVal = prices[a.ticker]?.change || 0;
                        bVal = prices[b.ticker]?.change || 0;
                        break;
                    case 'dayChange':
                        aVal = dayChangeAmounts[a.ticker] || ((prices[a.ticker]?.change || 0) / 100) * (a.quantity * currentPriceA);
                        bVal = dayChangeAmounts[b.ticker] || ((prices[b.ticker]?.change || 0) / 100) * (b.quantity * currentPriceB);
                        break;
                    case 'currentValue':
                        aVal = a.quantity * currentPriceA;
                        bVal = b.quantity * currentPriceB;
                        break;
                    case 'unrealizedPL':
                        aVal = (a.quantity * currentPriceA) - (a.quantity * a.avgCost);
                        bVal = (b.quantity * currentPriceB) - (b.quantity * b.avgCost);
                        break;
                    case 'unrealizedPLPercent':
                        aVal = ((a.quantity * currentPriceA) - (a.quantity * a.avgCost)) / (a.quantity * a.avgCost) * 100;
                        bVal = ((b.quantity * currentPriceB) - (b.quantity * b.avgCost)) / (b.quantity * b.avgCost) * 100;
                        break;
                    case 'realizedPL':
                        aVal = REALIZED_GAINS_BY_TICKER[a.ticker] || 0;
                        bVal = REALIZED_GAINS_BY_TICKER[b.ticker] || 0;
                        break;
                    default:
                        return 0;
                }

                if (aVal === undefined || aVal === null) return 1;
                if (bVal === undefined || bVal === null) return -1;
                
                if (typeof aVal === 'string') {
                    return sortDirection === 'asc' 
                        ? aVal.localeCompare(bVal)
                        : bVal.localeCompare(aVal);
                }
                
                return sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
            });
        }

        // Helper function to find closest snapshot before or on a given date
        function getClosestSnapshot(snapshots, targetDate) {
            const dates = Object.keys(snapshots)
                .filter(d => d <= targetDate)
                .sort()
                .reverse();
            return dates.length > 0 ? snapshots[dates[0]] : 0;
        }

        async function loadMarketAlerts() {
            try {
                let query = supabase.from('market_alerts').select('*');
                
                if (viewMode === 'active') {
                    // Active alerts: last 2 days, not archived
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    const cutoffDate = yesterday.toISOString().split('T')[0];
                    
                    query = query
                        .eq('archived', false)
                        .gte('alert_date', cutoffDate);
                } else {
                    // Archived alerts: based on selected period
                    query = query.eq('archived', true);
                    
                    const today = new Date();
                    let cutoffDate;
                    
                    switch(archivedPeriod) {
                        case 'yesterday':
                            const yesterday = new Date();
                            yesterday.setDate(yesterday.getDate() - 1);
                            const yesterdayStr = yesterday.toISOString().split('T')[0];
                            const twoDaysAgo = new Date();
                            twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
                            const twoDaysAgoStr = twoDaysAgo.toISOString().split('T')[0];
                            query = query
                                .gte('alert_date', twoDaysAgoStr)
                                .lte('alert_date', yesterdayStr);
                            break;
                            
                        case 'week':
                            cutoffDate = new Date();
                            cutoffDate.setDate(cutoffDate.getDate() - 7);
                            query = query.gte('alert_date', cutoffDate.toISOString().split('T')[0]);
                            break;
                            
                        case 'month':
                            cutoffDate = new Date();
                            cutoffDate.setDate(cutoffDate.getDate() - 30);
                            query = query.gte('alert_date', cutoffDate.toISOString().split('T')[0]);
                            break;
                            
                        case 'all':
                            break;
                    }
                }
                
                query = query
                    .order('alert_date', { ascending: false })
                    .order('created_at', { ascending: false });
                
                if (viewMode === 'active') {
                    query = query.limit(200);
                } else {
                    query = query.limit(500);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                
                marketAlerts = data || [];
                render();
            } catch (error) {
                console.error('❌ Error loading market alerts:', error);
            }
        }

        function getFilteredEntrySignals() {
            let filtered = entrySignals;
            
            // STEP 1: Apply summary strength filter first (if active)
            if (summaryFilter === 'multiple') {
                // Show only stocks with 2+ signals
                const stockSignalCounts = {};
                entrySignals.forEach(signal => {
                    stockSignalCounts[signal.ticker] = (stockSignalCounts[signal.ticker] || 0) + 1;
                });
                filtered = filtered.filter(signal => stockSignalCounts[signal.ticker] > 1);
            } else if (summaryFilter === 'multi_strong') {
                // Show only stocks with 2+ STRONG BUY signals
                const strongSignalsByStock = {};
                entrySignals.forEach(signal => {
                    if (signal.signal_type === 'blue_zone_strong' || 
                        signal.signal_type === 'golden_cross_strong' ||
                        signal.signal_type === 'macd_strong' ||
                        signal.signal_type === 'bull_flag_strong' ||
                        signal.signal_type === 'vcp_strong') {
                        strongSignalsByStock[signal.ticker] = (strongSignalsByStock[signal.ticker] || 0) + 1;
                    }
                });
                filtered = filtered.filter(signal => strongSignalsByStock[signal.ticker] > 1);
            } else if (summaryFilter === 'strong_buy') {
                // Show only Strong Buy signals
                filtered = filtered.filter(signal => 
                    signal.signal_type === 'blue_zone_strong' || 
                    signal.signal_type === 'golden_cross_strong' ||
                    signal.signal_type === 'macd_strong' ||
                    signal.signal_type === 'bull_flag_strong' ||
                    signal.signal_type === 'vcp_strong'
                );
            } else if (summaryFilter === 'buy') {
                // Show only Buy signals
                filtered = filtered.filter(signal => 
                    signal.signal_type === 'blue_zone_buy' || 
                    signal.signal_type === 'golden_cross_buy' ||
                    signal.signal_type === 'macd_buy' ||
                    signal.signal_type === 'bull_flag_buy' ||
                    signal.signal_type === 'vcp_buy'
                );
            }
            
            // STEP 2: Apply indicator filter (if not on summary tab)
            if (entrySignalsSubTab !== 'summary') {
                filtered = filtered.filter(signal => {
                    if (entrySignalsSubTab === 'narrow_cpr') {
                        return signal.signal_type === 'narrow_cpr_breakaway';
                    } else if (entrySignalsSubTab === 'blue_zone') {
                        return signal.signal_type === 'blue_zone_strong' || signal.signal_type === 'blue_zone_buy';
                    } else if (entrySignalsSubTab === 'golden_cross') {
                        return signal.signal_type === 'golden_cross_strong' || signal.signal_type === 'golden_cross_buy';
                    } else if (entrySignalsSubTab === 'macd') {
                        return signal.signal_type === 'macd_strong' || signal.signal_type === 'macd_buy';
                    } else if (entrySignalsSubTab === 'darvas_box') {
                        return signal.signal_type === 'darvas_box';
                    } else if (entrySignalsSubTab === 'pullback_bounce') {
                        return signal.signal_type === 'pullback_bounce';
                    } else if (entrySignalsSubTab === 'bull_flag') {
                        return signal.signal_type === 'bull_flag_strong' || signal.signal_type === 'bull_flag_buy';
                    } else if (entrySignalsSubTab === 'vcp') {
                        return signal.signal_type === 'vcp_strong' || signal.signal_type === 'vcp_buy';
                    }
                    return true;
                });
            }
            
            // STEP 3: Filter out dismissed signals
            filtered = filtered.filter(signal => {
                const key = `${signal.ticker}-${signal.signal_type}-${signal.alert_date}`;
                return !dismissedSignals.includes(key);
            });

            // STEP 4: Sort by RS rank (best rank first), unranked signals go last
            filtered.sort((a, b) => {
                const rankA = a.details?.rs_rank ?? 9999;
                const rankB = b.details?.rs_rank ?? 9999;
                return rankA - rankB;
            });
            
            return filtered;
        }

        function calculateDayGain(todayValue, yesterdayValue, todayDate, transactions, HISTORICAL_TRANSACTIONS) {
            // Get transactions for today
            const dayTransactions = transactions.filter(t => t.date === todayDate);
            const dayCashFlows = HISTORICAL_TRANSACTIONS.filter(cf => cf.date === todayDate);
            
            // Calculate sold value
            const soldValue = dayTransactions
                .filter(t => t.type === 'SELL')
                .reduce((sum, t) => sum + (t.quantity * t.price), 0);
            
            // Calculate purchased value
            const purchasedValue = dayTransactions
                .filter(t => t.type === 'BUY')
                .reduce((sum, t) => sum + (t.quantity * t.price), 0);
            
            // Calculate withdrawals
            const withdrawals = dayCashFlows
                .filter(cf => cf.type === 'Withdrawal' || cf.type === 'Withdrawl')
                .reduce((sum, cf) => sum + cf.amount, 0);
            
            // Calculate deposits
            const deposits = dayCashFlows
                .filter(cf => cf.type === 'Deposit')
                .reduce((sum, cf) => sum + cf.amount, 0);
            
            // Day gain = Today + withdrawals + sold - deposits - purchased - Yesterday
            return todayValue + withdrawals + soldValue - deposits - purchasedValue - yesterdayValue;
        }
        
        function calculateWinningStreak(snapshots, transactions, HISTORICAL_TRANSACTIONS, currentValue) {
            const dates = Object.keys(snapshots).sort();
            
            // Add today if not in snapshots
            const today = new Date().toISOString().split('T')[0];
            const allDates = [...dates];
            if (!allDates.includes(today)) {
                allDates.push(today);
            }
            
            // Get last 10 dates
            const last10Dates = allDates.slice(-11); // -11 because we need previous day for first calculation
            
            let wins = 0;
            let losses = 0;
            let currentStreak = 0;
            let streakDirection = null;
            
            // Calculate day gains for last 10 days
            for (let i = last10Dates.length - 1; i > 0; i--) {
                const currentDate = last10Dates[i];
                const previousDate = last10Dates[i - 1];
                
                const currentVal = currentDate === today ? currentValue : snapshots[currentDate];
                const previousVal = snapshots[previousDate];
                
                if (!currentVal || !previousVal) continue;
                
                const dayGain = calculateDayGain(currentVal, previousVal, currentDate, transactions, HISTORICAL_TRANSACTIONS);
                
                const isWin = dayGain > 0;
                const isLoss = dayGain < 0;
                
                // Count wins/losses (for last 10 days)
                if (i <= 10) { // Only count last 10 days
                    if (isWin) wins++;
                    if (isLoss) losses++;
                }
                
                // Calculate current streak (from most recent backwards)
                if (i === last10Dates.length - 1) {
                    // Most recent day
                    if (isWin) {
                        currentStreak = 1;
                        streakDirection = 'winning';
                    } else if (isLoss) {
                        currentStreak = 1;
                        streakDirection = 'losing';
                    }
                } else {
                    // Check if streak continues
                    if (streakDirection === 'winning' && isWin) {
                        currentStreak++;
                    } else if (streakDirection === 'losing' && isLoss) {
                        currentStreak++;
                    } else {
                        // Streak broken, stop counting
                        break;
                    }
                }
            }
            
            return {
                wins: wins,
                losses: losses,
                totalDays: Math.min(10, last10Dates.length - 1),
                currentStreak: currentStreak,
                streakDirection: streakDirection
            };
        }
        
        function calculateWinRateScore(wins, totalDays) {

        function calculateEventScore(alertDate, basePoints, decayDays) {
            if (!alertDate) return 0;
            
            const today = new Date();
            const alertDay = new Date(alertDate);
            const daysOld = Math.floor((today - alertDay) / (1000 * 60 * 60 * 24));
            
            if (daysOld >= decayDays) return 0;  // Event expired
            if (daysOld < 0) return 0;  // Future date (shouldn't happen)
            
            // Linear decay: Day 0 = 100%, Day 1 = 80%, etc.
            const decayFactor = 1 - (daysOld / decayDays);
            return basePoints * decayFactor;
        }

        function calculateStockPSI(stock, ticker, currentPrice, avgCost, quantity) {
            const cleanTicker = ticker.replace('.NS', '').replace('.BO', '').replace('.BSE', '');
            const tickerMapping = { 'KPENERGY': 'KPEL', 'DENTAWATER': 'DENTA', 'TRIL': 'TARIL', 'M&M': 'M_M' };
            const mappedTicker = tickerMapping[cleanTicker] || cleanTicker;
            
            const alerts = stockAlerts[mappedTicker] || stockAlerts[cleanTicker] || stockAlerts[ticker] || [];
            const emaData = stockEmaData[mappedTicker] || stockEmaData[cleanTicker];
            
            if (!currentPrice || currentPrice === 0) {
                return { score: 50, grade: 'NEUTRAL', gradeColor: '#f59e0b', gradeIcon: '⚖️' };
            }
            
            let scores = {
                emaPosition: 0,
                recentEvents: 0,
                momentumIndicators: 0,
                performance: 0
            };
            
            // CATEGORY 1: EMA Position (±50 points)
            if (emaData && emaData.ema_20 && emaData.ema_50 && emaData.ema_200) {
                const bucket = getEmaBucket(currentPrice, emaData.ema_20, emaData.ema_50, emaData.ema_200);
                
                switch(bucket) {
                    case 'BULLISH_STACK':
                        scores.emaPosition = 50;
                        break;
                    case 'ABOVE_ALL':
                        scores.emaPosition = 35;
                        break;
                    case 'ABOVE_200':
                        scores.emaPosition = 20;
                        break;
                    case 'BELOW_50':
                        scores.emaPosition = 10;
                        break;
                    case 'BELOW_20':
                        scores.emaPosition = 0;
                        break;
                    case 'BELOW_ALL':
                        scores.emaPosition = -30;
                        break;
                    case 'BEARISH_STACK':
                        scores.emaPosition = -50;
                        break;
                    case 'MIXED':
                    default:
                        scores.emaPosition = 5;
                        break;
                }
            }
            
            // CATEGORY 2: Recent Events (±20 points, time-decayed)
            let eventScore = 0;
            alerts.forEach(alert => {
                const alertDate = alert.alert_date || alert.created_at?.split('T')[0];
                
                switch(alert.type) {
                    case 'golden_cross':
                    case 'ema_golden_cross':
                        eventScore += calculateEventScore(alertDate, 10, 5);

                        break;
                    case 'promoter_buying':

                        break;
                    case 'promoter_selling':
                        eventScore += calculateEventScore(alertDate, -10, 15);
                        break;
                }
            });
            scores.recentEvents = Math.min(20, Math.max(-20, eventScore));
            
            // CATEGORY 3: Momentum Indicators (±15 points)
            let momentumScore = 0;
            
            // Blue Zone check
            if (alerts.some(a => a.type === 'blue_zone_stocks')) {
                momentumScore = 15;
            } else {
                // Check RSI or proximity to 52-week high if available
                // For now, give partial credit for other signals
                if (alerts.some(a => a.type === 'volume_breakout_bullish')) {
                    momentumScore = 5;
                }
            }
            scores.momentumIndicators = momentumScore;
            
            // CATEGORY 4: Performance (±15 points) - Stock Level
            // 4A: Calculate stock's win rate over last 10 days (0-5 points)
            const stockHistory = calculateStockWinRate(ticker, currentPrice);
            const winRateScore = calculateWinRateScore(stockHistory.wins, stockHistory.totalDays);

            const plScore = Math.min(5, Math.max(-5, (plPct / 50) * 5));
            
            scores.performance = winRateScore + streakBonus + outperformanceScore + plScore;

    FIFO_COMPUTED = computeFIFOFromTransactions(transactions);

async function deleteTransaction(date, ticker, type, quantity, price) {
    if (!confirm(`Are you sure you want to delete this ${type} transaction for ${ticker}?\n\nThis will:\n- Remove the transaction from records\n- Reverse the portfolio changes\n- Update holdings accordingly`)) {
        return;
    }
    try {
        // Find the transaction in the array
        const txnIndex = transactions.findIndex(t => 
            t.date === date && 
            t.ticker === ticker && 
            t.type === type && 
            t.quantity === quantity && 
            t.price === price
        );
        
        if (txnIndex === -1) {
            alert('Transaction not found!');
            return;
        }
        
        const txn = transactions[txnIndex];
        const existingStock = portfolio.find(s => s.ticker === ticker);
        
        // Reverse the portfolio changes
        if (type === 'BUY') {
            // Reverse a BUY: reduce quantity and recalculate average cost
            if (existingStock) {
                if (existingStock.quantity <= quantity) {
                    // If this was the only purchase or we're removing all shares, remove the stock
                    portfolio = portfolio.filter(s => s.ticker !== ticker);
                    console.log(`  Removed ${ticker} from portfolio (all shares sold)`);
                } else {
                    // Recalculate average cost without this purchase
                    const totalCostBefore = existingStock.quantity * existingStock.avgCost;
                    const purchaseCost = quantity * price;
                    const newTotalCost = totalCostBefore - purchaseCost;
                    const newQuantity = existingStock.quantity - quantity;
                    
                    existingStock.quantity = newQuantity;
                    existingStock.avgCost = newTotalCost / newQuantity;
                }
            }
        } else if (type === 'SELL') {
            // Reverse a SELL: add back the quantity
            if (existingStock) {
                existingStock.quantity += quantity;
            } else {
                // Stock was fully sold and removed, need to add it back
                // We don't have the original avg cost, so we'll use the sell price as approximation
                portfolio.push({
                    name: txn.stock,
                    ticker: ticker,
                    quantity: quantity,
                    avgCost: price, // Using sell price as we don't have original cost
                    sector: txn.sector || 'Other'
                });
            }
        }
        
        // Remove from transactions array
        transactions.splice(txnIndex, 1);
        localStorage.setItem('transactions', JSON.stringify(transactions));

        // Delete from Supabase
        const { error: deleteError } = await supabase
            .from('transactions')
            .delete()
            .eq('portfolio', 'INDIAN')
            .eq('date', date)
            .eq('ticker', ticker)
            .eq('type', type)
            .eq('quantity', quantity)
            .eq('price', price);
        
        if (deleteError) throw deleteError;

        // Recompute FIFO from remaining transactions
        FIFO_COMPUTED = computeFIFOFromTransactions(transactions);

        // Update portfolio for this ticker
        const openLots = FIFO_COMPUTED.lotDetailsByTicker[ticker] || [];
        const fifoQty = openLots.reduce((s, l) => s + l.qty, 0);
        const fifoAvg = FIFO_COMPUTED.fifoAvgCost[ticker] || 0;
        const stockIdx = portfolio.findIndex(s => s.ticker === ticker);

        if (fifoQty > 0) {
            if (stockIdx >= 0) {
                portfolio[stockIdx].quantity = fifoQty;
                portfolio[stockIdx].avgCost = fifoAvg;
            } else {
                portfolio.push({ name: txn.stock, ticker, quantity: fifoQty, avgCost: fifoAvg, sector: txn.sector || 'Other' });
            }
        } else {
            if (stockIdx >= 0) portfolio.splice(stockIdx, 1);
        }

        // Update holdings in Supabase
        await saveHoldingsToSupabase(portfolio);
        localStorage.setItem('portfolio', JSON.stringify(portfolio));
        render();
        fetchPrices();
        alert('✅ Transaction deleted successfully!');
    } catch (error) {
        console.error('❌ Error deleting transaction:', error);
        alert('Error deleting transaction: ' + error.message);
    }
}

async function saveEditedTransaction(origDate, origTicker, origType, origQty, origPrice, newDate, newType, newStock, newTicker, newQty, newPrice, newSector, newStrategy) {
    try {
        const priceVal = parseFloat(newPrice);
        const qtyVal = parseInt(newQty);
        if (isNaN(priceVal) || priceVal <= 0) { alert('Invalid price'); return; }
        if (isNaN(qtyVal) || qtyVal <= 0) { alert('Invalid quantity'); return; }
        if (!newDate) { alert('Invalid date'); return; }
        if (!newTicker) { alert('Invalid ticker'); return; }

        // Update in Supabase
        const { error } = await supabase
            .from('transactions')
            .update({
                date: newDate,
                type: newType,
                stock: newStock || null,
                ticker: newTicker,
                quantity: qtyVal,
                price: priceVal,
                sector: newSector || null,
                strategy: newStrategy || null
            })
            .eq('portfolio', 'INDIAN')
            .eq('date', origDate)
            .eq('ticker', origTicker)
            .eq('type', origType)
            .eq('quantity', origQty)
            .eq('price', origPrice);

        if (error) throw error;

        // Also update sector in holdings table for this ticker
        if (newSector) {
            await supabase
                .from('holdings')
                .update({ sector: newSector })
                .eq('portfolio', 'INDIAN')
                .eq('ticker', newTicker);
        }

        // Update in local transactions array
        const txn = transactions.find(t =>
            t.date === origDate && t.ticker === origTicker &&
            t.type === origType && t.quantity === origQty && t.price === origPrice
        );
        if (txn) {
            txn.date = newDate;
            txn.type = newType;
            txn.stock = newStock || txn.stock;
            txn.ticker = newTicker;
            txn.quantity = qtyVal;
            txn.price = priceVal;
            txn.sector = newSector || null;
            txn.strategy = newStrategy || null;
        }

        // Recompute FIFO
        FIFO_COMPUTED = computeFIFOFromTransactions(transactions);

        editingTransaction = null;
        render();
        console.log('✅ Transaction updated');
    } catch (e) {
        console.error('❌ Error updating transaction:', e);
        alert('Error updating transaction: ' + e.message);
    }
}

        // XIRR calculation using Newton-Raphson method
        // XIRR calculation using Newton-Raphson method (Since Jan 2023)
        function calculateXIRR(currentPortfolioValue) {
            const cashFlows = [];
            const dates = [];
            
            // Initial investment (Jan 1, 2023)
            cashFlows.push(-XIRR_START_VALUE);
            dates.push(new Date(XIRR_START_DATE));
            
            // Add historical transactions (Jan 2023 - Sept 2025)
            HISTORICAL_TRANSACTIONS.forEach(txn => {
                const amount = txn.amount;
                // Withdrawl = money out (positive), Deposit = money in (negative)
                cashFlows.push(txn.type === 'Withdrawl' ? amount : -amount);
                dates.push(new Date(txn.date));
            });
            
            // Add current transactions (Oct 2025 onwards) - all months not in cash_flows
            const currentTransactions = transactions.filter(t => t.date >= CASH_FLOWS_END_DATE);
            currentTransactions.forEach(txn => {
                const amount = txn.quantity * txn.price;
                cashFlows.push(txn.type === 'BUY' ? -amount : amount);
                dates.push(new Date(txn.date));
            });
            
            // Current portfolio value as terminal value
            cashFlows.push(currentPortfolioValue);
            dates.push(new Date());
            
            // Newton-Raphson method to find XIRR
            let guess = 0.1;
            const maxIterations = 100;
            const tolerance = 0.0001;
            
            for (let i = 0; i < maxIterations; i++) {
                let npv = 0;
                let dnpv = 0;
                
                for (let j = 0; j < cashFlows.length; j++) {
                    const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
                    const yearFrac = daysDiff / 365;
                    const factor = Math.pow(1 + guess, yearFrac);
                    
                    npv += cashFlows[j] / factor;
                    dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
                }
                
                const newGuess = guess - npv / dnpv;
                
                if (Math.abs(newGuess - guess) < tolerance) {
                    return newGuess * 100;
                }
                
                guess = newGuess;
            }
            
            return null;
        }

// ── Per-Stock XIRR ──────────────────────────────────────────────────────────
// Computes XIRR for a single stock using its buy transactions and current value

function solveXIRR(cashFlows, dates) {
    if (cashFlows.length < 2) return null;
    const daysDiff = (dates[dates.length - 1] - dates[0]) / (1000 * 60 * 60 * 24);
    if (daysDiff < 1) return null;
    let guess = 0.1;
    for (let i = 0; i < 200; i++) {
        let npv = 0, dnpv = 0;
        for (let j = 0; j < cashFlows.length; j++) {
            const yf     = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
            const factor = Math.pow(1 + guess, yf);
            npv  += cashFlows[j] / factor;
            dnpv += -yf * cashFlows[j] / factor / (1 + guess);
        }
        if (Math.abs(dnpv) < 1e-10) break;
        const next = guess - npv / dnpv;
        if (Math.abs(next - guess) < 0.000001) return next * 100;
        guess = isFinite(next) ? next : 0.1;
    }
    return null;
}

// ── Holdings XIRR — uses FIFO open lots only ─────────────────────────────────
// Outflows = each lot's cost on its buy date; Inflow = today's market value
// This gives the annualised return on the current open position only
function computeHoldingsXIRR(ticker, currentValue) {
    try {
        const lots = (FIFO_COMPUTED.lotDetailsByTicker[ticker] || [])
            .filter(l => l.type === 'Buy' && l.qty > 0 && l.date);
        if (lots.length === 0 || currentValue <= 0) return null;

        const cashFlows = [];
        const dates     = [];

        lots.forEach(l => {
            cashFlows.push(-(l.qty * l.avgPrice));   // outflow on buy date
            dates.push(new Date(l.date));
        });

        cashFlows.push(currentValue);                 // terminal inflow today
        dates.push(new Date());

        return solveXIRR(cashFlows, dates);
    } catch(e) { return null; }
}

// ── Total XIRR — all transactions including sells + current value ─────────────
// Outflows = all buys; Inflows = all sells + current market value today
// This gives the lifetime annualised return on this stock including booked profits
function computeTotalXIRR(ticker, currentValue) {
    try {
        const txns = transactions
            .filter(t => t.ticker === ticker && (t.type === 'BUY' || t.type === 'SELL'))
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        if (txns.length === 0 || currentValue <= 0) return null;

        const cashFlows = [];
        const dates     = [];

        txns.forEach(t => {
            const amount = t.quantity * t.price;
            cashFlows.push(t.type === 'BUY' ? -amount : +amount);
            dates.push(new Date(t.date));
        });

        cashFlows.push(currentValue);                 // terminal inflow today
        dates.push(new Date());

        return solveXIRR(cashFlows, dates);
    } catch(e) { return null; }
}

// ── Custom Period XIRR ──
// startYM: 'YYYY-MM', endYM: 'YYYY-MM' or 'current'
function calculateCustomXIRR(startYM, endYM, currentPortfolioValue) {
    const snapshots = getSnapshots();

    // Find start value — last snapshot of startYM
    const startEntry = Object.entries(snapshots)
        .filter(([d]) => d.startsWith(startYM))
        .sort(([a], [b]) => b.localeCompare(a))[0];
    if (!startEntry) return { xirr: null, niftyCAGR: null, error: 'No snapshot for start month' };
    const startValue = startEntry[1];
    const startDate = new Date(startEntry[0]);
    console.log(`Custom XIRR: start=${startEntry[0]} value=${startValue}, end=${endYM}`);

    // Find end value & date
    let endValue, endDate;
    if (endYM === 'current') {
        endValue = currentPortfolioValue;
        endDate = new Date();
    } else {
        const endEntry = Object.entries(snapshots)
            .filter(([d]) => d.startsWith(endYM))
            .sort(([a], [b]) => b.localeCompare(a))[0];
        if (!endEntry) return { xirr: null, niftyCAGR: null, error: 'No snapshot for end month' };
        endValue = endEntry[1];
        endDate = new Date(endEntry[0]);
    }

    if (endDate <= startDate) return { xirr: null, niftyCAGR: null, error: 'End must be after start' };

    const startStr = startEntry[0];
    const endStr = endYM === 'current' ? new Date().toISOString().split('T')[0] : Object.entries(snapshots).filter(([d]) => d.startsWith(endYM)).sort(([a],[b]) => b.localeCompare(a))[0][0];

    // Build cash flows
    const cashFlows = [-startValue];
    const dates = [startDate];

    // Historical transactions (cash_flows table) within range
    HISTORICAL_TRANSACTIONS.forEach(txn => {
        if (txn.date > startStr && txn.date <= endStr) {
            cashFlows.push(txn.type === 'Withdrawl' ? txn.amount : -txn.amount);
            dates.push(new Date(txn.date));
        }
    });

    // Transactions table — only Oct 2025+ to avoid double counting
    const txnStart = startStr > CASH_FLOWS_END_DATE ? startStr : CASH_FLOWS_END_DATE;
    transactions.filter(t => t.date >= txnStart && t.date <= endStr).forEach(t => {
        cashFlows.push(t.type === 'BUY' ? -(t.quantity * t.price) : (t.quantity * t.price));
        dates.push(new Date(t.date));
    });

    // Terminal value
    cashFlows.push(endValue);
    dates.push(endDate);
    console.log(`Custom XIRR: total cashFlows=${cashFlows.length}, startValue=${startValue}, endValue=${endValue}, first=${cashFlows[0]}, last=${cashFlows[cashFlows.length-1]}`);

    // Newton-Raphson XIRR — try multiple starting guesses for robustness
    const npvFn = (rate) => cashFlows.reduce((s, cf, j) => {
        const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
        return s + cf / Math.pow(1 + rate, yf);
    }, 0);
    const dnpvFn = (rate) => cashFlows.reduce((s, cf, j) => {
        const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
        return s - yf * cf / Math.pow(1 + rate, yf) / (1 + rate);
    }, 0);

    let xirr = null;
    for (const startGuess of [0.1, -0.1, 0.5, -0.5, 1.0, -0.9]) {
        let guess = startGuess;
        let converged = false;
        for (let i = 0; i < 200; i++) {
            const npv = npvFn(guess);
            const dnpv = dnpvFn(guess);
            if (dnpv === 0 || !isFinite(dnpv)) break;
            const ng = guess - npv / dnpv;
            if (!isFinite(ng) || ng <= -1) break;
            if (Math.abs(ng - guess) < 0.00001) { guess = ng; converged = true; break; }
            guess = ng;
        }
        if (converged && isFinite(guess) && guess > -1) { xirr = guess * 100; break; }
    }
    console.log(`Custom XIRR result: ${xirr}`);

    // Nifty CAGR for same period
    const niftyStart = NIFTYBEES_MONTHLY[startYM] || NIFTYBEES_MONTHLY['2023-01'];
    const niftyEnd = endYM === 'current'
        ? (prices['NIFTYBEES.NS']?.price || null)
        : NIFTYBEES_MONTHLY[endYM];
    let niftyCAGR = null;
    let niftyPeriodPct = null;
    if (niftyStart && niftyEnd) {
        const years = (endDate - startDate) / (1000 * 60 * 60 * 24 * 365.25);
        niftyCAGR = years > 0 ? (Math.pow(niftyEnd / niftyStart, 1 / years) - 1) * 100 : null;
        niftyPeriodPct = (niftyEnd - niftyStart) / niftyStart * 100;
    }

    // Absolute gain = endValue - startValue - net cash flows
    const netCF = cashFlows.slice(1, -1).reduce((s, v) => s + v, 0); // exclude start and end
    const absoluteGain = endValue - startValue + netCF; // netCF already signed correctly
    const absoluteGainPct = (absoluteGain / startValue) * 100;

    return { xirr, niftyCAGR, niftyPeriodPct, absoluteGain, absoluteGainPct };
}

// ── Modified Dietz: cash-flow-weighted absolute return (no annualisation) ──
// Formula: (End - Start - ΣCF) / (Start + Σ(CF_i × W_i))
// W_i = (T - t_i) / T  →  fraction of period remaining when CF occurred
// BUYs = positive inflow, SELLs = negative (capital extracted), Deposits/Withdrawals same
function calculateModifiedDietz(currentPortfolioValue, year = null) {
    const currentYear = year || new Date().getFullYear();

    // Don't interfere with past-year special handling — only run for current year
    if (year && year < new Date().getFullYear()) return null;

    const yearStart = `${currentYear}-01-01`;
    const yearEnd   = `${currentYear}-12-31`;

    const snapshots = getSnapshots();

    // Use same start-value logic as getYTDStartValue() (holiday-aware lookback)
    let startValue = snapshots[`${currentYear - 1}-12-31`];
    if (!startValue) {
        for (let i = 1; i <= 5; i++) {
            const d = new Date(`${currentYear - 1}-12-31`);
            d.setDate(d.getDate() - i);
            const ds = d.toISOString().split('T')[0];
            if (snapshots[ds]) { startValue = snapshots[ds]; break; }
        }
    }
    if (!startValue || startValue <= 0) return null;

    const endValue = currentPortfolioValue;
    if (!endValue || endValue <= 0) return null;

    // Period length in days (Jan 1 → today)
    const periodStart = new Date(yearStart);
    const periodEnd   = new Date();
    const T = Math.max(1, (periodEnd - periodStart) / (1000 * 60 * 60 * 24));

    // Collect all cash flows in the YTD period
    // BUY  → positive (capital deployed into portfolio)
    // SELL → negative (capital extracted from portfolio as cash)
    // Only include Oct 2025 onwards - pre-Oct 2025 already covered by HISTORICAL_TRANSACTIONS
    const yearTransactions = transactions.filter(t => t.date >= yearStart && t.date <= yearEnd && t.date >= CASH_FLOWS_END_DATE);

    let netCF         = 0;  // Σ CF_i  (for numerator)
    let weightedCF    = 0;  // Σ CF_i × W_i  (for denominator)

    yearTransactions.forEach(t => {
        const cf       = t.type === 'BUY' ? (t.quantity * t.price) : -(t.quantity * t.price);
        const txDate   = new Date(t.date);
        const t_i      = Math.max(0, (txDate - periodStart) / (1000 * 60 * 60 * 24));
        const W_i      = (T - t_i) / T;
        netCF       += cf;
        weightedCF  += cf * W_i;
    });

    // Also account for cash deposits / withdrawals from HISTORICAL_TRANSACTIONS
    HISTORICAL_TRANSACTIONS.forEach(cf => {
        if (cf.date < yearStart || cf.date > yearEnd) return;
        const amount = cf.type === 'Deposit' ? cf.amount : (cf.type === 'Withdrawl' || cf.type === 'Withdrawal') ? -cf.amount : 0;
        if (amount === 0) return;
        const txDate = new Date(cf.date);
        const t_i    = Math.max(0, (txDate - periodStart) / (1000 * 60 * 60 * 24));
        const W_i    = (T - t_i) / T;
        netCF      += amount;
        weightedCF += amount * W_i;
    });

    const numerator   = endValue - startValue - netCF;
    const denominator = startValue + weightedCF;

    if (denominator <= 0) return null;

    const result = (numerator / denominator) * 100;
    console.log(`✅ Modified Dietz (${currentYear}): ${result.toFixed(2)}% | Start: ${startValue} | End: ${endValue} | NetCF: ${netCF} | WeightedCF: ${weightedCF}`);
    return result;
}

function calculateYTDXIRR(currentPortfolioValue, year = null) {
    const istTime = getISTTime();
    const currentYear = year || new Date().getFullYear();
    const yearStartDate = `${currentYear}-01-01`;
    const yearEndDate = `${currentYear}-12-31`;
    
    const cashFlows = [], dates = [];
    
    const snapshots = getSnapshots();
    const yearStartValue = snapshots[yearStartDate] || snapshots[`${currentYear - 1}-12-31`];
    
    if (!yearStartValue) {
        return null;
    }
    
    cashFlows.push(-yearStartValue);
    dates.push(new Date(yearStartDate));
    
    HISTORICAL_TRANSACTIONS.forEach(cf => {
        if (cf.date >= yearStartDate && cf.date <= yearEndDate) {
            const amount = (cf.type === 'Deposit') ? -cf.amount : (cf.type === 'Withdrawl' || cf.type === 'Withdrawal') ? cf.amount : 0;
            cashFlows.push(amount);
            dates.push(new Date(cf.date));
        }
    });
    
    // Only include Oct 2025 onwards - pre-Oct 2025 already covered by HISTORICAL_TRANSACTIONS
    const yearTransactions = transactions.filter(t => t.date >= yearStartDate && t.date <= yearEndDate && t.date >= CASH_FLOWS_END_DATE);
    yearTransactions.forEach(txn => {
        const amount = txn.quantity * txn.price;
        cashFlows.push(txn.type === 'BUY' ? -amount : amount);
        dates.push(new Date(txn.date));
    });
    
    const endValue = year && year < new Date().getFullYear() ? snapshots[yearEndDate] : currentPortfolioValue;
    if (!endValue) {
        return null;
    }
    
    cashFlows.push(endValue);
    dates.push(new Date(year && year < new Date().getFullYear() ? yearEndDate : Date.now()));
    
    // ... rest of Newton-Raphson calculation stays same
    
    let guess = 0.1;
    const maxIterations = 1000;
    const tolerance = 0.000001;
    
    for (let i = 0; i < maxIterations; i++) {
        let npv = 0, dnpv = 0;
        
        for (let j = 0; j < cashFlows.length; j++) {
            const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
            const yearFrac = daysDiff / 365.25;
            const factor = Math.pow(1 + guess, yearFrac);
            
            npv += cashFlows[j] / factor;
            dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
        }
        
        if (Math.abs(npv) < tolerance) {
            console.log(`✅ YTD XIRR: ${(guess * 100).toFixed(2)}%`);
            return guess * 100;
        }
        
        if (Math.abs(dnpv) < 1e-10) {
            guess = guess * 0.5;
            continue;
        }
        
        const newGuess = guess - npv / dnpv;
        const maxChange = 0.5;
        
        if (Math.abs(newGuess - guess) > maxChange) {
            guess = guess + Math.sign(newGuess - guess) * maxChange;
        } else {
            guess = newGuess;
        }
        
        if (guess < -0.99) guess = -0.5;
        if (guess > 10) guess = 1;
    }
    
    return null;
}
