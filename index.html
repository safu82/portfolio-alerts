                    changes.push({ type: 'FORMED_BULLISH_STACK', isBullish: true });
                }
                if (currentBucket === 'ABOVE_ALL' && ['BELOW_200', 'BELOW_50', 'BELOW_ALL', 'BEARISH_STACK'].includes(startBucket)) {
                    changes.push({ type: 'CROSSED_ABOVE_ALL', isBullish: true });
                }
                if (['ABOVE_ALL', 'MIXED', 'BELOW_20', 'BELOW_50'].includes(currentBucket) && startBucket === 'BELOW_200') {
                    changes.push({ type: 'CROSSED_ABOVE_200', isBullish: true });
                }
                
                // Significant bearish changes
                if (currentBucket === 'BEARISH_STACK' && startBucket !== 'BEARISH_STACK') {
                    changes.push({ type: 'FORMED_BEARISH_STACK', isBullish: false });
                }
                if (currentBucket === 'BELOW_ALL' && ['ABOVE_ALL', 'BULLISH_STACK'].includes(startBucket)) {
                    changes.push({ type: 'FELL_BELOW_ALL', isBullish: false });
                }
                if (currentBucket === 'BELOW_200' && !['BELOW_200', 'BELOW_ALL', 'BEARISH_STACK'].includes(startBucket)) {
                    changes.push({ type: 'FELL_BELOW_200', isBullish: false });
                }
                if (startBucket === 'BULLISH_STACK' && currentBucket !== 'BULLISH_STACK') {
                    changes.push({ type: 'BROKE_BULLISH_STACK', isBullish: false });
                }
            }
            
            if (changes.length === 0) return null;
            
            return {
                changes: changes,
                volatileCount: volatileCount,
                startBucket: startBucket,
                currentBucket: currentBucket
            };
        }
        
        // Generate bucket change badges
        function getBucketChangeBadges(ticker, currentPrice, emaData) {
            const changeInfo = detectBucketChanges(ticker, currentPrice, emaData);
            if (!changeInfo) return { badges: '', rowClass: '' };
            
            const badges = [];
            let rowClass = '';
            
            // Determine overall sentiment (bullish or bearish)
            const bullishChanges = changeInfo.changes.filter(c => c.isBullish);
            const bearishChanges = changeInfo.changes.filter(c => c.isBullish === false);
            
            if (bullishChanges.length > bearishChanges.length) {
                rowClass = 'bucket-change-bullish';
            } else if (bearishChanges.length > bullishChanges.length) {
                rowClass = 'bucket-change-bearish';
            }
            
            // Add volatile indicator if multiple changes
            if (changeInfo.volatileCount > 2) {
                badges.push(`<span class="bucket-change-badge bucket-change-volatile-badge" title="Multiple bucket changes today (${changeInfo.volatileCount} changes)">⚡ Volatile (${changeInfo.volatileCount}×)</span>`);
            }
            
            // Add specific change badges (max 2)
            const changeLabels = {
                'FORMED_BULLISH_STACK': '🟢 Bullish Stack Formed',
                'CROSSED_ABOVE_ALL': '⬆️ Above All EMAs',
                'CROSSED_ABOVE_200': '↗️ Above 200 EMA',
                'FORMED_BEARISH_STACK': '🔴 Bearish Stack Formed',
                'FELL_BELOW_ALL': '⬇️ Below All EMAs',
                'FELL_BELOW_200': '↘️ Below 200 EMA',
                'BROKE_BULLISH_STACK': '💔 Broke Bullish Stack'
            };
            
            changeInfo.changes.slice(0, 2).forEach(change => {
                const label = changeLabels[change.type] || change.type;
                const badgeClass = change.isBullish ? 'bucket-change-bullish-badge' : 'bucket-change-bearish-badge';
                badges.push(`<span class="bucket-change-badge ${badgeClass}" title="${label}">${label}</span>`);
            });
            
            return {
                badges: badges.join(''),
                rowClass: rowClass
            };
        }

        // =====================================================
        // SECTOR ANALYSIS CHARTS
        // =====================================================
        function renderSectorCharts(portfolio, mode = 'unrealized') {
            // Calculate sector data with ETF split
            const sectorData = {};
            const sectorCost = {};
            const sectorDayChange = {};
            
            portfolio.forEach(stock => {
                let sector = stock.sector || 'Other';
                
                // Split ETF into Gold ETF and Silver ETF
                if (sector === 'ETF') {
                    if (stock.ticker === 'GOLDSHARE.NS' || stock.name.toUpperCase().includes('GOLD')) {
                        sector = 'Gold ETF';
                    } else if (stock.ticker === 'SILVERETF.NS' || stock.name.toUpperCase().includes('SILVER')) {
                        sector = 'Silver ETF';
                    }
                }
                
                const currentPrice = prices[stock.ticker]?.price || stock.avgCost;
                // Calculate previous price from current price and change percentage
                const changePercent = prices[stock.ticker]?.change || 0;
                const previousPrice = changePercent !== 0 ? currentPrice / (1 + changePercent/100) : currentPrice;
                const currentValue = stock.quantity * currentPrice;
                const costValue = stock.quantity * stock.avgCost;
                const dayChange = stock.quantity * (currentPrice - previousPrice);
                
                sectorData[sector] = (sectorData[sector] || 0) + currentValue;
                sectorCost[sector] = (sectorCost[sector] || 0) + costValue;
                sectorDayChange[sector] = (sectorDayChange[sector] || 0) + dayChange;
            });
            
            // Calculate total portfolio value
            const totalValue = Object.values(sectorData).reduce((a, b) => a + b, 0);
            
            // Filter sectors > 5% and create Others
            const significantSectors = {};
            const significantCost = {};
            const significantDayChange = {};
            let othersValue = 0;
            let othersCost = 0;
            let othersDayChange = 0;
            
            Object.keys(sectorData).forEach(sector => {
                const percentage = (sectorData[sector] / totalValue) * 100;
                if (percentage >= 5) {
                    significantSectors[sector] = sectorData[sector];
                    significantCost[sector] = sectorCost[sector];
                    significantDayChange[sector] = sectorDayChange[sector];
                } else {
                    othersValue += sectorData[sector];
                    othersCost += sectorCost[sector];
                    othersDayChange += sectorDayChange[sector];
                }
            });
            
            // Add Others if exists
            if (othersValue > 0) {
                significantSectors['Others'] = othersValue;
                significantCost['Others'] = othersCost;
                significantDayChange['Others'] = othersDayChange;
            }
            
            // Sort by value, but keep Others at the end
            const sectors = Object.keys(significantSectors).sort((a, b) => {
                // Always put 'Others' at the end
                if (a === 'Others') return 1;
                if (b === 'Others') return -1;
                // Sort all other sectors by value (descending)
                return significantSectors[b] - significantSectors[a];
            });
            const values = sectors.map(s => significantSectors[s]);
            const gains = sectors.map(s => significantSectors[s] - significantCost[s]);
            const dayChanges = sectors.map(s => significantDayChange[s]);
            
            // Destroy existing charts
            const existingPie = Chart.getChart('sectorPieChart');
            if (existingPie) existingPie.destroy();
            const existingBar = Chart.getChart('sectorBarChart');
            if (existingBar) existingBar.destroy();
            
            // PIE CHART - Show percentages
            setTimeout(() => {
                const pieCtx = document.getElementById('sectorPieChart');
                if (pieCtx) {
                    new Chart(pieCtx, {
                        type: 'doughnut',
                        data: {
                            labels: sectors.map(s => {
                                const pct = ((significantSectors[s] / totalValue) * 100).toFixed(1);
                                return `${s} (${pct}%)`;
                            }),
                            datasets: [{
                                data: values,
                                backgroundColor: [
                                    '#667eea', '#764ba2', '#f093fb', '#4facfe',
                                    '#43e97b', '#fa709a', '#fee140', '#30cfd0',
                                    '#a8edea', '#fed6e3', '#c471f5', '#ff9a9e'
                                ],
                                borderWidth: 2,
                                borderColor: darkMode ? '#1e293b' : '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: {
                                        color: darkMode ? '#94a3b8' : '#64748b',
                                        padding: 15,
                                        font: { size: 12 }
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const value = context.parsed;
                                            const percentage = ((value / totalValue) * 100).toFixed(1);
                                            return ` ${percentage}% (₹${(value/10000000).toFixed(2)}Cr)`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }, 100);
            
            // BAR CHART - With toggle for Day Change / Unrealized Gains
            setTimeout(() => {
                const barCtx = document.getElementById('sectorBarChart');
                if (barCtx) {
                    const dataToShow = mode === 'day' ? dayChanges : gains;
                    const labelText = mode === 'day' ? 'Day Change' : 'Unrealized P/L';
                    
                    new Chart(barCtx, {
                        type: 'bar',
                        data: {
                            labels: sectors,
                            datasets: [{
                                label: labelText,
                                data: dataToShow,
                                backgroundColor: dataToShow.map(g => g >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)'),
                                borderColor: dataToShow.map(g => g >= 0 ? '#10b981' : '#ef4444'),
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            indexAxis: 'y',
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const value = context.parsed.x;
                                            return ` ${value >= 0 ? '+' : ''}₹${(value/100000).toFixed(2)}L`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: darkMode ? '#94a3b8' : '#64748b',
                                        callback: function(value) {
                                            return '₹' + (value/100000).toFixed(0) + 'L';
                                        }
                                    },
                                    grid: {
                                        color: darkMode ? '#334155' : '#e2e8f0'
                                    }
                                },
                                y: {
                                    ticks: {
                                        color: darkMode ? '#94a3b8' : '#64748b',
                                        autoSkip: false
                                    },
                                    grid: {
                                        display: false
                                    }
                                }
                            }
                        }
                    });
                }
            }, 100);
        }

        // ── Sector Rankings ───────────────────────────────────────────────────
        let sectorRankingsSort = 'rank'; // 'rank' | 'momentum'
        let expandedSector = null; // currently expanded sector name

        function sortSectorRankings(by) {
            sectorRankingsSort = by;
            // Update button highlights immediately without full re-render
            ['rank','momentum','composite'].forEach(key => {
                const btn = document.querySelector(`[onclick="sortSectorRankings('${key}')"]`);
                if (btn) {
                    btn.style.background = key === by ? 'var(--primary-color)' : 'var(--border-color)';
                    btn.style.color = key === by ? 'white' : 'var(--text-secondary)';
                }
            });
            renderSectorRankings();
        }

        function renderSectorRankings() {
            const quadrantEl = document.getElementById('sectorQuadrantSummary');
            const tableEl    = document.getElementById('sectorRankingsTable');
            if (!quadrantEl || !tableEl) return;

            const sectors = Object.values(sectorRankings);
            if (!sectors.length) {
                tableEl.innerHTML = '<div style="color:var(--text-secondary);text-align:center;padding:20px">Sector data loading... (requires get_all_sector_rankings RPC)</div>';
                return;
            }

            // Build signal count per sector
            const signalsBySector = {};
            (entrySignals || []).forEach(sig => {
                const sec = tickerSectorMap[sig.ticker] || tickerSectorMap[sig.ticker.replace('.NS','') + '.NS'];
                if (sec) signalsBySector[sec] = (signalsBySector[sec] || 0) + 1;
            });

            // Compute composite score for each sector (0–100)
            // RS 40% + EMA200 Breadth 25% + Bullish Stack 20% + Momentum 15%
            const maxRS  = Math.max(...sectors.map(s => s.median_rs || 0));
            const maxMom = Math.max(...sectors.map(s => Math.abs(s.rs_momentum || 0))) || 1;
            sectors.forEach(s => {
                const rsNorm   = maxRS  > 0 ? (s.median_rs   || 0) / maxRS  * 100 : 0;
                const emaNorm  = s.pct_above_ema200  || 0;  // already 0-100
                const bullNorm = s.pct_bullish_stack || 0;  // already 0-100
                const momNorm  = Math.min(100, Math.max(0, 50 + ((s.rs_momentum || 0) / maxMom) * 50));
                const rawScore = rsNorm * 0.40 + emaNorm * 0.25 + bullNorm * 0.20 + momNorm * 0.15;
                // Confidence weight by stock count — sectors with < 5 stocks are penalised
                // confidence: 1 stock=20%, 2=35%, 3=50%, 4=65%, 5+=100%
                const count = s.stock_count || 1;
                const confidence = count >= 5 ? 1.0 : count === 4 ? 0.65 : count === 3 ? 0.50 : count === 2 ? 0.35 : 0.20;
                s._composite = Math.round(rawScore * confidence);
            });

            // Sort
            const sorted = [...sectors].sort((a, b) =>
                sectorRankingsSort === 'momentum'   ? (b.rs_momentum      || 0) - (a.rs_momentum      || 0) :
                sectorRankingsSort === 'composite'  ? (b._composite       || 0) - (a._composite       || 0) :
                sectorRankingsSort === 'ema200'     ? (b.pct_above_ema200 || 0) - (a.pct_above_ema200 || 0) :
                sectorRankingsSort === 'bullish'    ? (b.pct_bullish_stack|| 0) - (a.pct_bullish_stack|| 0) :
                sectorRankingsSort === 'stocks'     ? (b.stock_count      || 0) - (a.stock_count      || 0) :
                                                      (a.sector_rank      || 99) - (b.sector_rank      || 99)
            );

            // Quadrant counts
            const qCounts = { leading: 0, weakening: 0, improving: 0, lagging: 0 };
            sectors.forEach(s => { if (s.rrg_quadrant) qCounts[s.rrg_quadrant]++; });
            const qConfig = {
                leading:   { label: '🟢 Leading',   bg: '#3fb95015', color: '#3fb950', border: '#3fb95030' },
                improving: { label: '🔵 Improving', bg: '#58a6ff15', color: '#58a6ff', border: '#58a6ff30' },
                weakening: { label: '🟡 Weakening', bg: '#e3b34115', color: '#e3b341', border: '#e3b34130' },
                lagging:   { label: '🔴 Lagging',   bg: '#f8514915', color: '#f85149', border: '#f8514930' },
            };
            quadrantEl.innerHTML = Object.entries(qConfig).map(([q, cfg]) => `
                <div style="background:${cfg.bg};border:1px solid ${cfg.border};border-radius:8px;padding:12px;text-align:center">
                    <div style="font-size:13px;font-weight:700;color:${cfg.color}">${cfg.label}</div>
                    <div style="font-size:28px;font-weight:700;margin:4px 0">${qCounts[q]}</div>
                    <div style="font-size:11px;color:var(--text-secondary)">sectors</div>
                </div>`).join('');

            // Table
            tableEl.innerHTML = `
            <table style="width:100%;border-collapse:collapse;font-size:13px">
                <thead>
                    <tr style="border-bottom:2px solid var(--border-color)">
                        <th onclick="sortSectorRankings('rank')" style="text-align:left;padding:8px 10px;color:${sectorRankingsSort==='rank'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by RS Rank">RANK ${sectorRankingsSort==='rank'?'▼':''}</th>
                        <th style="text-align:left;padding:8px 10px;color:var(--text-secondary);font-size:11px;font-weight:600;letter-spacing:0.5px">SECTOR</th>
                        <th onclick="sortSectorRankings('rank')" style="text-align:left;padding:8px 10px;color:${sectorRankingsSort==='rank'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by RS Score">RS SCORE ${sectorRankingsSort==='rank'?'▼':''}</th>
                        <th onclick="sortSectorRankings('momentum')" style="text-align:right;padding:8px 10px;color:${sectorRankingsSort==='momentum'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by Momentum">MOMENTUM ${sectorRankingsSort==='momentum'?'▼':''}</th>
                        <th onclick="sortSectorRankings('ema200')" style="text-align:right;padding:8px 10px;color:${sectorRankingsSort==='ema200'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by % Above EMA200">ABOVE EMA200 ${sectorRankingsSort==='ema200'?'▼':''}</th>
                        <th onclick="sortSectorRankings('bullish')" style="text-align:right;padding:8px 10px;color:${sectorRankingsSort==='bullish'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by Bullish Stack">BULLISH STACK ${sectorRankingsSort==='bullish'?'▼':''}</th>
                        <th style="text-align:center;padding:8px 10px;color:var(--text-secondary);font-size:11px;font-weight:600;letter-spacing:0.5px">QUADRANT</th>
                        <th onclick="sortSectorRankings('composite')" style="text-align:right;padding:8px 10px;color:${sectorRankingsSort==='composite'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by Composite Score">COMPOSITE ${sectorRankingsSort==='composite'?'▼':''}</th>
                        <th onclick="sortSectorRankings('stocks')" style="text-align:right;padding:8px 10px;color:${sectorRankingsSort==='stocks'?'var(--text-primary)':'var(--text-secondary)'};font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;user-select:none" title="Sort by Stock Count">STOCKS ${sectorRankingsSort==='stocks'?'▼':''}</th>
                    </tr>
                </thead>
                <tbody>
                    ${sorted.map(s => {
                        const qc = qConfig[s.rrg_quadrant] || { label: '—', color: 'var(--text-secondary)', bg: 'transparent', border: 'transparent' };

                // Market Strength Analysis
        let marketZonesData = {};
        let expandedZones = {};
        
        async function loadMarketStrength() {
            try {
                // Fetch latest snapshots
                const { data: snapshots, error: snapshotError } = await supabase
                    .from('daily_stock_snapshots')
                    .select('ticker, close, ema_200, ema_50')
                    .order('snapshot_date', { ascending: false })
                    .limit(600);
                
                if (snapshotError) throw snapshotError;
                
                // Get unique latest snapshot per ticker
                const latestByTicker = {};
                snapshots.forEach(row => {
                    if (!latestByTicker[row.ticker] && row.ema_200) {
                        latestByTicker[row.ticker] = row;
                    }
                });
                
                const stocks = Object.values(latestByTicker);
                
                // Fetch today's signals
                // Use IST date (UTC+5:30) to avoid day mismatch
                const istNow = new Date(Date.now() + 5.5 * 60 * 60 * 1000);
                const todayIST = istNow.toISOString().split('T')[0];
                const yesterdayIST = new Date(istNow - 86400000).toISOString().split('T')[0];

                const { data: signals, error: signalsError } = await supabase
                    .from('entry_signals')
                    .select('ticker, signal_type, signal_strength')
                    .in('alert_date', [todayIST, yesterdayIST]);

                console.log(`📊 Market Strength signals loaded: ${signals?.length || 0} (${todayIST} / ${yesterdayIST})`);
                
                // Map signals by ticker
                const signalsByTicker = {};
                if (signals) {
                    signals.forEach(signal => {
                        if (!signalsByTicker[signal.ticker]) {
                            signalsByTicker[signal.ticker] = [];
                        }
                        signalsByTicker[signal.ticker].push(signal);
                    });
                }
                
                // Categorize stocks into zones
                const zones = {
                    strongMomentum: [],
                    healthyUptrend: [],
                    retestZone: [],
                    recoveryZone: [],
                    weakZone: []
                };
                
                let totalWeightedScore = 0;
                let bullishCount = 0;
                let bearishCount = 0;
                
                stocks.forEach(stock => {
                    const distance = ((stock.close - stock.ema_200) / stock.ema_200) * 100;
                    const stockData = {
                        ticker: stock.ticker,
                        distance: distance,
                        price: stock.close,
                        close: stock.close,
                        ema_200: stock.ema_200,
                        signals: signalsByTicker[stock.ticker] || []
                    };
                    
                    // Categorize into zones
                    if (distance > 10) {
                        zones.strongMomentum.push(stockData);
                        totalWeightedScore += 85;
                        bullishCount++;
                    } else if (distance > 2) {
                        zones.healthyUptrend.push(stockData);
                        totalWeightedScore += 65;
                        bullishCount++;
                    } else if (distance >= -2) {
                        zones.retestZone.push(stockData);
                        totalWeightedScore += 50;
                        if (distance >= 0) bullishCount++;
                        else bearishCount++;
                    } else if (distance >= -10) {
                        if (distance >= -5) {
                            // -2 to -5: slightly below
                            totalWeightedScore += 40;
                        } else {
                            // -5 to -10: recovery zone
                            zones.recoveryZone.push(stockData);
                            totalWeightedScore += 25;
                        }
                        bearishCount++;
                    } else {
                        zones.weakZone.push(stockData);
                        totalWeightedScore += 5;
                        bearishCount++;
                    }
                });
                
                const total = stocks.length;
                const score = Math.round(totalWeightedScore / total);
                
                // Store zones data globally
                marketZonesData = zones;
                
                // Update display
                updateMarketStrengthDisplay(score, bullishCount, bearishCount, total, zones);
                
            } catch (error) {
                console.error('Error loading market strength:', error);
            }
        }
        
        function updateMarketStrengthDisplay(score, bullish, bearish, total, zones) {
            // Score and label
            document.getElementById('marketStrengthScore').textContent = score;
            
            let label, recommendation;
            if (score >= 80) {
                label = '🚀 Very Strong';
                recommendation = 'Market is very strong. Aggressive on Strong Buys (3+ confirmations). Normal position sizing.';
            } else if (score >= 65) {
                label = '💪 Strong';
                recommendation = 'Market is strong. Take Strong Buys and multi-signal setups (2+ confirmations). Standard approach.';
            } else if (score >= 50) {
                label = '😐 Neutral';
                recommendation = 'Market is neutral. Be selective. Require 2+ confirmations for entries. Reduce position sizes by 25%.';
            } else if (score >= 35) {
                label = '⚠️ Weak';
                recommendation = 'Market is weak. Require 3+ confirmations. Focus on Recovery signals. Reduce position sizes by 50%. Cash is a position.';
            } else {
                label = '🐻 Very Weak';
                recommendation = 'Market is very weak. Defensive mode. Skip most signals. Focus only on exceptional Recovery setups. Position sizes: 25-50%.';
            }
            
            document.getElementById('marketStrengthLabel').textContent = label;
            document.getElementById('marketRecommendation').textContent = recommendation;
            
            // Bulls and Bears
            const bullishPct = Math.round(bullish/total*100);
            const bearishPct = Math.round(bearish/total*100);
            
            document.getElementById('bullishCount').textContent = bullish;
            document.getElementById('bullishPercent').textContent = `${bullishPct}%`;
            document.getElementById('bearishCount').textContent = bearish;
            document.getElementById('bearishPercent').textContent = `${bearishPct}%`;
            
            // Zone counts and bars
            const maxCount = Math.max(
                zones.strongMomentum.length,
                zones.healthyUptrend.length,
                zones.retestZone.length,
                zones.recoveryZone.length,
                zones.weakZone.length
            );
            
            updateZoneDisplay('strongMomentum', zones.strongMomentum.length, maxCount, total);
            updateZoneDisplay('healthyUptrend', zones.healthyUptrend.length, maxCount, total);
            updateZoneDisplay('retestZone', zones.retestZone.length, maxCount, total);
            updateZoneDisplay('recoveryZone', zones.recoveryZone.length, maxCount, total);
            updateZoneDisplay('weakZone', zones.weakZone.length, maxCount, total);
            
            // Date
            document.getElementById('marketStrengthDate').textContent = new Date().toLocaleDateString();
        }

        function getLargestHolding(sortedPortfolio) {
            if (!sortedPortfolio || sortedPortfolio.length === 0) {
                return { name: '-', value: 0, percent: 0 };
            }
            const largest = sortedPortfolio.reduce((max, stock) => {
                const value = stock.quantity * (prices[stock.ticker]?.price || stock.avgCost);
                return value > max.value ? { name: stock.name, value: value, ticker: stock.ticker } : max;
            }, { name: '', value: 0, ticker: '' });
            
            const totalValue = sortedPortfolio.reduce((sum, stock) => 
                sum + (stock.quantity * (prices[stock.ticker]?.price || stock.avgCost)), 0);
            largest.percent = totalValue > 0 ? (largest.value / totalValue) * 100 : 0;
            return largest;
        }
        
        function getMostProfitable(sortedPortfolio) {
            if (!sortedPortfolio || sortedPortfolio.length === 0) {
                return { name: '-', profit: 0, percent: 0 };
            }
            const mostProfitable = sortedPortfolio.reduce((max, stock) => {
                const currentPrice = prices[stock.ticker]?.price || stock.avgCost;
                const profit = (currentPrice - stock.avgCost) * stock.quantity;
                return profit > max.profit ? { name: stock.name, profit: profit, avgCost: stock.avgCost, currentPrice: currentPrice, ticker: stock.ticker } : max;
            }, { name: '', profit: -Infinity, avgCost: 0, currentPrice: 0, ticker: '' });
            
            if (mostProfitable.profit === -Infinity || mostProfitable.profit <= 0) {
                return { name: 'No stocks in profit', profit: 0, percent: 0 };
            }
            mostProfitable.percent = mostProfitable.avgCost > 0 ? ((mostProfitable.currentPrice - mostProfitable.avgCost) / mostProfitable.avgCost) * 100 : 0;
            return mostProfitable;
        }
        
        function getLeastProfitable(sortedPortfolio) {
            if (!sortedPortfolio || sortedPortfolio.length === 0) {
                return { name: '-', profit: 0, percent: 0 };
            }
            const leastProfitable = sortedPortfolio.reduce((min, stock) => {
                const currentPrice = prices[stock.ticker]?.price || stock.avgCost;
                const profit = (currentPrice - stock.avgCost) * stock.quantity;
                return profit < min.profit ? { name: stock.name, profit: profit, avgCost: stock.avgCost, currentPrice: currentPrice, ticker: stock.ticker } : min;
            }, { name: '', profit: Infinity, avgCost: 0, currentPrice: 0, ticker: '' });
            
            if (leastProfitable.profit === Infinity || leastProfitable.profit >= 0) {
                return { name: 'No stocks in loss', profit: 0, percent: 0 };
            }
            leastProfitable.percent = leastProfitable.avgCost > 0 ? ((leastProfitable.currentPrice - leastProfitable.avgCost) / leastProfitable.avgCost) * 100 : 0;
            return leastProfitable;
        }

        function getWinningLosingMonths(year) {
            const snapshots = getSnapshots();
            let winning = 0;
            let losing = 0;
            
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth() + 1;
            const maxMonth = (year === currentYear) ? currentMonth : 12;
            
            // Helper function to get latest snapshot for a given year-month
            function getLatestSnapshotForMonth(year, month) {
                const monthStr = String(month).padStart(2, '0');
                const allDates = Object.keys(snapshots).filter(date => date.startsWith(`${year}-${monthStr}-`));
                if (allDates.length === 0) return null;
                allDates.sort();
                return { date: allDates[allDates.length - 1], value: snapshots[allDates[allDates.length - 1]] };
            }
            
            for (let month = 1; month <= maxMonth; month++) {
                const monthStr = String(month).padStart(2, '0');
                
                // For current month in current year, use live portfolio value
                let currentMonthSnapshot;
                if (year === currentYear && month === currentMonth) {
                    const metrics = calculateMetrics();
                    currentMonthSnapshot = { 
                        date: new Date().toISOString().split('T')[0], 
                        value: metrics.totalCurrentValue 
                    };
                } else {
                    currentMonthSnapshot = getLatestSnapshotForMonth(year, month);
                }
                
                // Get latest snapshot for previous month
                const prevMonth = month === 1 ? 12 : month - 1;
                const prevYear = month === 1 ? year - 1 : year;
                const prevMonthSnapshot = getLatestSnapshotForMonth(prevYear, prevMonth);
                
                if (currentMonthSnapshot && prevMonthSnapshot) {
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = currentMonthSnapshot.date;
                    
                    const monthCashFlows = HISTORICAL_TRANSACTIONS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                    const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                    const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                    
                    const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd && t.date >= CASH_FLOWS_END_DATE);
                    const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    
                    const gain = currentMonthSnapshot.value + withdrawals + soldValue - deposits - purchasedValue - prevMonthSnapshot.value;
                    
                    if (gain >= 0) winning++;
                    else losing++;
                }
            }
            
            return { winning, losing };
        }

                    emaData.ema_200 > emaData.ema_50 && emaData.ema_50 > emaData.ema_20 && emaData.ema_20 > currentPrice) {

                }
                
                // Count Blue Zone

                    filterCounts.blue_zone++;

                    filterCounts.bucket_changes++;

                    const today = new Date(); today.setHours(0,0,0,0);
                    const d = new Date(ev.earnings_date); d.setHours(0,0,0,0);
                    const diff = Math.round((d - today) / 86400000);
                    return (diff >= 0 && diff <= 5) ? diff : null;
                })();

                            let aVal, bVal;

                                case 'stock': aVal = a.stock; bVal = b.stock; break;
                                case 'status': aVal = a.status; bVal = b.status; break;
                                case 'totalBought': aVal = a.totalBought; bVal = b.totalBought; break;
                                case 'totalSold': aVal = a.totalSold; bVal = b.totalSold; break;
                                case 'openQty': aVal = a.openQty; bVal = b.openQty; break;
                                case 'avgBuy': aVal = a.avgBuy || 0; bVal = b.avgBuy || 0; break;
                                case 'avgSell': aVal = a.avgSell || 0; bVal = b.avgSell || 0; break;
                                case 'cmp': aVal = a.cmp || 0; bVal = b.cmp || 0; break;
                                case 'realizedPnL': aVal = a.realizedPnL || 0; bVal = b.realizedPnL || 0; break;
                                case 'mtmPnL': aVal = a.mtmPnL || 0; bVal = b.mtmPnL || 0; break;
                                default: aVal = a.combinedPnL || 0; bVal = b.combinedPnL || 0;
                            }
                            if (squaredOffSortDir === 'asc') return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
                            return aVal < bVal ? 1 : aVal > bVal ? -1 : 0;
                        });

                        // Totals

                            <span style="color: var(--text-secondary);">${rows.filter(r => r.status === 'Squared Off').length} squared off · ${rows.filter(r => r.status === 'Partial').length} partial · ${rows.filter(r => r.status === 'Open').length} open · ${rows.filter(r => r.status === 'Pre-period Sell').length} pre-period sells</span>
                        </div>
                        <div class="overflow-x-auto">
                        <table>
                            <thead>
                                <tr>
                                    <th style="cursor:pointer;" ${thClick('stock')}>Stock${sortIcon('stock')}</th>
                                    <th class="text-center" style="cursor:pointer;" ${thClick('status')}>Status${sortIcon('status')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('totalBought')}>Bought${sortIcon('totalBought')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('totalSold')}>Sold${sortIcon('totalSold')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('openQty')}>Open${sortIcon('openQty')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('avgBuy')}>Avg Buy${sortIcon('avgBuy')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('avgSell')}>Avg Sell${sortIcon('avgSell')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('cmp')}>CMP${sortIcon('cmp')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('realizedPnL')}>Realized P&L${sortIcon('realizedPnL')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('mtmPnL')}>MTM (Open)${sortIcon('mtmPnL')}</th>
                                    <th class="text-right" style="cursor:pointer;" ${thClick('combinedPnL')}>Combined P&L${sortIcon('combinedPnL')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${sorted.map(r => {
                                    const statusColor = r.status === 'Squared Off' ? 'badge-green' : r.status === 'Partial' ? 'badge-yellow' : r.status === 'Pre-period Sell' ? 'badge-red' : 'badge-blue';
                                    return `<tr>
                                        <td><a href="https://www.tradingview.com/chart/?symbol=NSE:${r.ticker.replace('.NS','').replace('.BO','')}" target="_blank" style="color:var(--text-primary);text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${r.stock}</a></td>
                                        <td class="text-center"><span class="badge ${statusColor}">${r.status}</span></td>
                                        <td class="text-right">${r.totalBought > 0 ? formatNumber(r.totalBought) : '—'}</td>
                                        <td class="text-right">${r.totalSold > 0 ? formatNumber(r.totalSold) : '—'}</td>
                                        <td class="text-right">${r.openQty > 0 ? formatNumber(r.openQty) : '—'}</td>
                                        <td class="text-right">${r.avgBuy ? '₹' + formatNumber(r.avgBuy) : '—'}</td>
                                        <td class="text-right">${r.avgSell ? '₹' + formatNumber(r.avgSell) : '—'}</td>
                                        <td class="text-right">${r.cmp ? '₹' + formatNumber(r.cmp) : '—'}</td>
                                        <td class="text-right">${fmtPnL(r.realizedPnL)}</td>
                                        <td class="text-right">${fmtPnL(r.mtmPnL)}</td>
                                        <td class="text-right">${fmtPnL(r.combinedPnL)}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                            <tfoot>
                                <tr style="border-top: 2px solid var(--border-color); font-weight: 700; font-size: 0.85rem;">

                                    <td class="text-right">—</td>
                                    <td class="text-right">${fmtPnL(totalRealized)}</td>
                                    <td class="text-right">${fmtPnL(totalMTMOpen)}</td>
                                    <td class="text-right">${fmtPnL(totalCombined)}</td>
                                </tr>
                            </tfoot>
                        </table>
                        </div>`;
                    })()}

        function rankSlopeBadge(slope, rs_rank) {
    if (slope == null) return '';
    const improving = slope < 0;
    const color = improving
        ? (slope < -5 ? '#10b981' : '#f59e0b')   // green if fast, amber if slow
        : '#ef4444';                                // red if worsening
    const arrow = improving ? '↑' : '↓';
    const title = improving
        ? `Rank improving ${Math.abs(slope).toFixed(1)} positions/day`
        : `Rank worsening ${Math.abs(slope).toFixed(1)} positions/day`;
    return `<span style="font-size:11px;font-weight:600;color:${color}" title="${title}">${arrow}${Math.abs(slope).toFixed(0)}/d</span>`;
}

function computePreSignalTrend(ticker) {
            const history = preSignalHistory[ticker] || [];
            if (history.length < 2) return null;

            const scores = history.map(h => h.score);
            const first  = scores[0];
            const last   = scores[scores.length - 1];
            const totalGain = last - first;

            // Check for big jump (>=15 pts total regardless of path)
            const isBigJump = totalGain >= 10;

            // Check streak — consecutive days not falling by more than 2pts
            let streak = 1;
            let isClean = true;
            for (let i = scores.length - 1; i > 0; i--) {
                if (scores[i] >= scores[i-1] - 2) {
                    streak++;
                } else {
                    isClean = false;
                    break;
                }
            }

            // Choppiness check — count reversals
            let reversals = 0;
            for (let i = 1; i < scores.length - 1; i++) {
                if ((scores[i] < scores[i-1]) && (scores[i] < scores[i+1])) reversals++;
                if ((scores[i] > scores[i-1]) && (scores[i] > scores[i+1])) reversals++;
            }
            const isChoppy = reversals >= 2;

            return { streak, isClean, isBigJump, totalGain, isChoppy, days: history.length, scores };
        }

        function createChart(metrics) {
            const canvas = document.getElementById('portfolioChart');
            if (!canvas) return;
            
            if (portfolioChart) {
                portfolioChart.destroy();
            }
            
            const snapshots = getSnapshots();
            const textColor = darkMode ? '#94a3b8' : '#64748b';
            const gridColor = darkMode ? '#334155' : '#e2e8f0';
            
            if (selectedChartType === 'cumulative') {
                // Cumulative gains from Jan 2023
                const startDate = new Date('2022-12-01');
                const endDate = new Date();
                const currentMonth = endDate.getMonth() + 1;
                const currentYear = endDate.getFullYear();
                const months = [];
                const cumulativeGains = [];
                let runningTotal = 0;
                
                for (let d = new Date(startDate); d <= endDate; d.setMonth(d.getMonth() + 1)) {
                    const year = d.getFullYear();
                    const month = d.getMonth() + 1;
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    months.push(d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }));
                    
                    // Get month start and end values
                    const prevMonthEnd = month === 1 
                        ? snapshots[`${year-1}-12-31`] 
                        : snapshots[`${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`];
                    
                    // For current month in current year, calculate gain dynamically
                    let monthEndValue;
                    if (year === currentYear && month === currentMonth) {
                        monthEndValue = metrics.totalCurrentValue;
                    } else {
                        monthEndValue = snapshots[monthEnd];
                    }
                    
                    if (prevMonthEnd && monthEndValue) {
                        const monthCashFlows = HISTORICAL_TRANSACTIONS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                        const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                        const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                        
                        const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd && t.date >= CASH_FLOWS_END_DATE);
                        const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                        const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                        
                        const gain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                        runningTotal += gain;
                    }
                    
                    cumulativeGains.push(runningTotal);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Cumulative Gains',
                            data: cumulativeGains,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#667eea',
                            pointHoverBackgroundColor: '#667eea',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: darkMode ? '#1e293b' : '#ffffff',
                                titleColor: textColor,
                                bodyColor: textColor,
                                borderColor: gridColor,
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '₹' + new Intl.NumberFormat('en-IN').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { 
                                    color: textColor,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {
                                        return '₹' + (value / 10000000).toFixed(1) + 'Cr';
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                // Monthly gains bar chart (existing code)
                const year = selectedChartYear;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const monthlyGains = [];
                const currentMonth = new Date().getMonth() + 1; // 1-12
                const currentYear = new Date().getFullYear();
                
                for (let month = 1; month <= 12; month++) {
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    // Find most recent snapshot before period start (handles weekends/holidays)
                    const prevMonthEndDate = month === 1 
                        ? `${year-1}-12-31`
                        : `${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`;
                    const prevMonthEnd = getClosestSnapshot(snapshots, prevMonthEndDate);
                    
                    // For current month in current year, use Period Gains value directly
                    if (year === currentYear && month === currentMonth && selectedPeriodMonth === currentMonth) {
                        monthlyGains.push(metrics.periodGains);
                        continue;
                    }
                    
                    // Find most recent snapshot on or before month end (handles weekends/holidays)
                    const monthEndValue = getClosestSnapshot(snapshots, monthEnd);
                    
                    if (!prevMonthEnd || !monthEndValue) {
                        monthlyGains.push(null);
                        continue;
                    }
                    
                    const monthCashFlows = HISTORICAL_TRANSACTIONS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                    const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                    const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                    
                    const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd && t.date >= CASH_FLOWS_END_DATE);
                    const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    
                    const gain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                    monthlyGains.push(gain);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Monthly Gain/Loss',
                            data: monthlyGains,
                            backgroundColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.2)';
                                return val >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)';
                            }),
                            borderColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.5)';
                                return val >= 0 ? 'rgba(16, 185, 129, 1)' : 'rgba(239, 68, 68, 1)';
                            }),
                            borderWidth: 2,
                            borderRadius: 6
                        }]
                    },
                    options: {

                        plugins: {

                            tooltip: {
                                mode: 'index',

                                backgroundColor: darkMode ? '#1e293b' : '#ffffff',
                                titleColor: textColor,
                                bodyColor: textColor,
                                borderColor: gridColor,
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        if (value === null) return 'No data';
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '₹' + new Intl.NumberFormat('en-IN').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { color: textColor }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {

async function loadPreSignals() {
    try {
        const today = new Date().toISOString().split('T')[0];

        // Try today first
        let { data, error } = await supabase
            .from('presignal_scores')
            .select('*')
            .eq('score_date', today)
            .order('top_rule_score', { ascending: false });
        if (error) throw error;

        // Fall back to most recent available date
        if (!data || data.length === 0) {
            const latest = await supabase
                .from('presignal_scores')
                .select('score_date')
                .order('score_date', { ascending: false })
                .limit(1);
            if (latest.data && latest.data.length > 0) {
                const latestDate = latest.data[0].score_date;
                const fallback = await supabase
                    .from('presignal_scores')
                    .select('*')
                    .eq('score_date', latestDate)
                    .order('top_rule_score', { ascending: false });
                data = fallback.data || [];
                console.log(`✅ Pre-signals: no data for today, showing latest (${latestDate}) — ${data.length} stocks`);
            }
        } else {
            console.log(`✅ Loaded ${data.length} pre-signals for ${today}`);
        }

        preSignals = data || [];

        // Fetch 7-day score history for trend tracking
        if (preSignals.length > 0) {
            const tickers = [...new Set(preSignals.map(s => s.ticker))];
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const sevenDaysAgoStr = sevenDaysAgo.toISOString().split('T')[0];

            const { data: histData } = await supabase
                .from('presignal_scores')
                .select('ticker, score_date, top_rule_score')
                .in('ticker', tickers)
                .gte('score_date', sevenDaysAgoStr)
                .order('score_date', { ascending: true });

            preSignalHistory = {};
            (histData || []).forEach(row => {
                if (!preSignalHistory[row.ticker]) preSignalHistory[row.ticker] = [];
                preSignalHistory[row.ticker].push({ date: row.score_date, score: row.top_rule_score });
            });
        }

    } catch (e) {
        console.error('Error loading pre-signals:', e);
        preSignals = [];
        preSignalHistory = {};
    }
}

async function initializeDashboard() {
    const supabasePortfolio = await loadPortfolioFromSupabase();
    if (supabasePortfolio && supabasePortfolio.length > 0) {
        portfolio = supabasePortfolio;
        marketCaps = buildMarketCapsFromPortfolio(supabasePortfolio);
    } else {
        portfolio = JSON.parse(localStorage.getItem('portfolio')) || INITIAL_PORTFOLIO;
    }
    
    const supabaseTransactions = await loadTransactionsFromSupabase();
    if (supabaseTransactions && supabaseTransactions.length > 0) {
        transactions = supabaseTransactions;
        localStorage.setItem('transactions', JSON.stringify(transactions));
    } else {
        transactions = JSON.parse(localStorage.getItem('transactions')) || INITIAL_TRANSACTIONS;
    }

    // ── Run FIFO engine from transactions ──────────────────────────────────
    if (transactions && transactions.length > 0) {
        FIFO_COMPUTED = computeFIFOFromTransactions(transactions);

        // Update portfolio array: qty and avgCost from FIFO for known tickers
        // Add new tickers from transactions that aren't in holdings table yet
        const txnTickers = Object.keys(FIFO_COMPUTED.fifoAvgCost);
        txnTickers.forEach(ticker => {
            const openLots = FIFO_COMPUTED.lotDetailsByTicker[ticker] || [];
            const fifoQty = openLots.reduce((s, l) => s + l.qty, 0);
            if (fifoQty <= 0) return; // fully exited — skip
            const existing = portfolio.find(s => s.ticker === ticker);
            if (existing) {
                // Update qty and avgCost to FIFO values
                existing.quantity = fifoQty;
                existing.avgCost = FIFO_COMPUTED.fifoAvgCost[ticker];
            } else {
                // New stock from transactions not yet in holdings — add it
                const txn = transactions.find(t => t.ticker === ticker);
                if (txn) {
                    portfolio.push({
                        name: txn.stock || ticker,
                        ticker,
                        quantity: fifoQty,
                        avgCost: FIFO_COMPUTED.fifoAvgCost[ticker],
                        sector: txn.sector || 'Unknown'
                    });
                }
            }
        });

        // Remove stocks with zero FIFO qty (fully sold)
        portfolio = portfolio.filter(s => {
            const openLots = FIFO_COMPUTED.lotDetailsByTicker[s.ticker];
            if (!openLots) return true; // not in transactions — keep from holdings
            const fifoQty = openLots.reduce((sum, l) => sum + l.qty, 0);
            return fifoQty > 0;
        });

        // Save updated holdings back to Supabase
        await saveHoldingsToSupabase(portfolio);
        console.log(`✅ Portfolio updated from FIFO: ${portfolio.length} stocks`);
    }
    // ── End FIFO engine ────────────────────────────────────────────────────
    
    const supabaseCashFlows = await loadCashFlowsFromSupabase();
    if (supabaseCashFlows && supabaseCashFlows.length > 0) {
        HISTORICAL_TRANSACTIONS.length = 0;
        HISTORICAL_TRANSACTIONS.push(...supabaseCashFlows);
    } else {
    }
    
    const supabaseSnapshots = await loadSnapshotsFromSupabase();
    if (supabaseSnapshots && Object.keys(supabaseSnapshots).length > 0) {
        localStorage.setItem('portfolioSnapshots', JSON.stringify(supabaseSnapshots));
    }
    
    await loadNiftyBeesMonthlyFromSupabase();
        // Load alerts
    stockAlerts = await loadAlertsFromSupabase();
        await loadPreSignals();
        await loadEarningsCalendar();
        await loadDeclaredEarnings();
    loadIndexCards(); // fire-and-forget, non-blocking

    LIFETIME_DIVIDENDS_BY_TICKER = await loadDividendsFromSupabase();
    
    // Load entry signals
    await loadEntrySignals();

    // Load sector rankings for Technical Alerts tab (single RPC call)
    sectorRankings = await loadSectorRankings();
    console.log(`✅ Sector rankings loaded: ${Object.keys(sectorRankings).length} sectors`);

    // Load fundamentals for portfolio stocks (for conviction score)
    stockFundamentals = await fetchPortfolioFundamentals();
    
    // Check if we should reset bucket change alerts (new trading day)
    if (shouldResetAlerts()) {
    }
    
    fetchPrices();
    await fetchMTMPrices();  // Wait for MTM prices to load
    await fetchEmaValues();  // Fetch EMA data for stacked EMAs
    await calculateAllPivots();
    render();
}

function exportHoldingsToExcel() {
    const today = new Date().toISOString().split('T')[0];
    const wb = XLSX.utils.book_new();
    const exportPortfolio = getSortedPortfolio();

    // Sheet 1: Summary (one row per stock)
    const summaryRows = exportPortfolio.map(stock => {
        const price   = prices[stock.ticker]?.price || 0;
        const fifoAvg = FIFO_COMPUTED.fifoAvgCost[stock.ticker] ?? stock.avgCost;
        const value   = stock.quantity * price;
        const cost    = stock.quantity * fifoAvg;
        const gain    = value - cost;
        const gainPct = cost > 0 ? (gain / cost) * 100 : 0;
        const dayChg  = prices[stock.ticker]?.day_change_pct || 0;
        const emaKey  = stock.ticker.replace('.NS','').replace('.BO','');
        const emaData = stockEmaData[emaKey] || {};
        return {
            'Stock':           stock.name,
            'Ticker':          stock.ticker,
            'Sector':          stock.sector || '',
            'Qty':             Number(stock.quantity),
            'FIFO Avg Cost':   Number(Math.round(fifoAvg * 100) / 100),
            'CMP':             Number(price),
            'Value':           Number(Math.round(value)),
            'Cost':            Number(Math.round(cost)),
            'Unrealized P&L':  Number(Math.round(gain)),
            'P&L %':           Number(Math.round(gainPct * 100) / 100),
            'Day Change %':    Number(Math.round(dayChg * 100) / 100),
            'EMA 20':          emaData.ema_20 ? Number(emaData.ema_20) : '',
            'EMA 50':          emaData.ema_50 ? Number(emaData.ema_50) : '',
            'EMA 200':         emaData.ema_200 ? Number(emaData.ema_200) : '',
            'RS Rank':         emaData.rs_rank ? Number(emaData.rs_rank) : '',
        };
    });

    const ws1 = XLSX.utils.json_to_sheet(summaryRows);
    ws1['!cols'] = [
        {wch:28},{wch:16},{wch:18},{wch:8},{wch:14},{wch:10},
        {wch:14},{wch:14},{wch:16},{wch:10},{wch:14},
        {wch:10},{wch:10},{wch:10},{wch:10}
    ];
    XLSX.utils.book_append_sheet(wb, ws1, 'Holdings Summary');

    // Sheet 2: FIFO Lot Detail (one row per open lot)
    const lotRows = [];
    exportPortfolio.forEach(stock => {
        const price = prices[stock.ticker]?.price || 0;
        const lots  = FIFO_COMPUTED.lotDetailsByTicker[stock.ticker] || [];
        lots.forEach((lot, i) => {
            const mktValue = lot.qty * price;
            const gain     = mktValue - lot.cost;
            const gainPct  = lot.cost > 0 ? (gain / lot.cost) * 100 : 0;
            lotRows.push({
                'Stock':         stock.name,
                'Ticker':        stock.ticker,
                'Lot #':         Number(i + 1),
                'Buy Date':      lot.date,
                'Type':          lot.type,
                'Qty':           Number(lot.qty),
                'Buy Price':     Number(Math.round(lot.avgPrice * 100) / 100),
                'Lot Cost':      Number(Math.round(lot.cost)),
                'CMP':           Number(price),
                'Mkt Value':     Number(Math.round(mktValue)),
                'Lot P&L':       Number(Math.round(gain)),
                'Lot P&L %':     Number(Math.round(gainPct * 100) / 100),
                'Tax Status':    lot.taxStatus,
            });

function exportTransactionsToExcel() {
    let dateFrom, dateTo, filename, sheetName;

    if (txnExportMode === 'custom') {
        dateFrom = txnExportDateFrom;
        dateTo   = txnExportDateTo;
        if (!dateFrom || !dateTo) { alert('Please select both From and To dates.'); return; }
        if (dateFrom > dateTo) { alert('From date must be before To date.'); return; }
        // dateTo is inclusive — add 1 day for the filter
        const toExclusive = new Date(dateTo);
        toExclusive.setDate(toExclusive.getDate() + 1);
        dateTo = toExclusive.toISOString().split('T')[0];
        filename  = `Transactions_${dateFrom}_to_${txnExportDateTo}.xlsx`;
        sheetName = `${dateFrom} to ${txnExportDateTo}`.slice(0, 31);
    } else {
        const year  = selectedTransactionYear;
        const month = selectedTransactionMonth;
        const monthStr   = String(month).padStart(2, '0');
        const nextYear   = month === 12 ? year + 1 : year;
        const nextMonth  = month === 12 ? 1 : month + 1;
        dateFrom  = `${year}-${monthStr}-01`;
        dateTo    = `${nextYear}-${String(nextMonth).padStart(2, '0')}-01`;
        const monthName  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month - 1];
        filename  = `Transactions_${monthName}_${year}.xlsx`;
        sheetName = `${monthName} ${year}`;
    }

    const filtered = [...transactions]
        .filter(t => t.date >= dateFrom && t.date < dateTo)
        .sort((a, b) => b.date.localeCompare(a.date));

    if (filtered.length === 0) { alert('No transactions found for the selected period.'); return; }

    const wb = XLSX.utils.book_new();
    const rows = filtered.map(t => ({
        'Date':      t.date,
        'Stock':     t.stock,
        'Ticker':    t.ticker,
        'Type':      t.type,
        'Qty':       Number(t.quantity),
        'Price':     Number(t.price),
        'Value':     Math.round(Number(t.quantity) * Number(t.price)),
        'Strategy':  t.strategy || '',
        'Sector':    t.sector || '',
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:12},{wch:28},{wch:16},{wch:6},{wch:8},{wch:12},{wch:14},{wch:16},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename);
}

async function generateReport() {
    const startDate = document.getElementById('report-start-date').value;
    const endDate = document.getElementById('report-end-date').value;
    const statusDiv = document.getElementById('report-status');
    const statusText = statusDiv.querySelector('span');
    
    if (!startDate || !endDate) {
        alert('Please select both start and end dates');
        return;
    }
    
    if (new Date(startDate) > new Date(endDate)) {
        alert('Start date must be before end date');
        return;
    }
    
    // Show loading status
    statusDiv.style.display = 'block';
    statusText.textContent = '⏳ Generating report...';
    statusText.style.color = '#667eea';
    
    try {
        // Call the Python server
        const response = await fetch('http://localhost:5000/generate-report', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                portfolio: 'INDIAN',
                start_date: startDate,
                end_date: endDate
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to generate report');
        }
        
        // Download the PDF
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Portfolio_Report_INDIAN_${startDate}_to_${endDate}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        statusText.textContent = '✅ Report downloaded!';
        statusText.style.color = '#27ae60';
        
        // Hide status after 3 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
        
    } catch (error) {
        console.error('Report generation error:', error);
        
        // Check if server is running
        if (error.message.includes('fetch')) {
            statusText.textContent = '❌ Server not running';
            statusText.style.color = '#c0392b';
            
            // Show instructions to start server
            const instructions = `The report server is not running. To start it:

1. Open a new terminal window

2. Navigate to your Downloads folder:
   cd Downloads

3. Run this command:
   python report_server.py

4. Keep the terminal open and try again!

The server will show: "🚀 Report Server starting on http://localhost:5000"`;
            
            alert(instructions);
        } else {
            statusText.textContent = '❌ Error: ' + error.message;
            statusText.style.color = '#c0392b';
        }

async function lookupSectorForTicker(ticker) {

            .from('indian_stock_sectors')
            .select('sector, company_name')

// Debounce function to avoid too many lookups
let sectorLookupTimeout = null;
window.handleTickerInput = async function() {
    const tickerInput = document.getElementById('ticker');
    const sectorInput = document.getElementById('sector');
    const stockNameInput = document.getElementById('stockName');
    
    if (!tickerInput || !sectorInput) return;
    
    const ticker = tickerInput.value.trim().toUpperCase();
    
    // Clear previous timeout
    if (sectorLookupTimeout) clearTimeout(sectorLookupTimeout);
    
    // Remove any existing status indicators
    const existingStatus = tickerInput.parentElement?.querySelector('.ticker-status');
    if (existingStatus) existingStatus.remove();
    
    if (ticker.length < 3) {
        sectorInput.value = '';
        sectorInput.style.borderColor = '';
        sectorInput.style.background = '';
        return;
    }
    
    // Show loading
    const statusDiv = document.createElement('div');
    statusDiv.className = 'ticker-status';
    statusDiv.style.cssText = 'font-size: 12px; margin-top: 4px; color: var(--text-secondary);';
    statusDiv.textContent = '🔍 Looking up sector...';
    tickerInput.parentElement.appendChild(statusDiv);
    
    // Debounce the lookup
    sectorLookupTimeout = setTimeout(async () => {
        const result = await lookupSectorForTicker(ticker);
        
        if (result) {
            // Found in database
            sectorInput.value = result.sector;
            sectorInput.style.borderColor = '#10b981';
            sectorInput.style.background = 'rgba(16, 185, 129, 0.1)';
            
            // Update status
            statusDiv.textContent = `✅ ${result.company_name} - Sector: ${result.sector}`;
            statusDiv.style.color = '#10b981';
            
            // Also update stock name if empty
            if (stockNameInput && !stockNameInput.value) {
                stockNameInput.value = result.company_name;
            }
        } else {
            // Not found in database
            sectorInput.value = '';
            sectorInput.style.borderColor = '#f59e0b';
            sectorInput.style.background = 'rgba(245, 158, 11, 0.1)';
            sectorInput.placeholder = 'Sector not found - enter manually';
            
            statusDiv.textContent = '⚠️ Ticker not found in database - you can enter sector manually';
            statusDiv.style.color = '#f59e0b';
        }
    }, 500); // Wait 500ms after user stops typing
}

function calculateRatiosStats(data) {
    const stats = {
        gold_silver_ratio: { values: [], min: 0, max: 0, mean: 0, stdDev: 0, ma50: 0, ma200: 0 },
        india_vix: { values: [], min: 0, max: 0, mean: 0, stdDev: 0, ma50: 0, ma200: 0 },
        market_cap_gdp_ratio: { values: [], min: 0, max: 0, mean: 0, stdDev: 0 },
        dxy: { values: [], min: 0, max: 0, mean: 0, stdDev: 0 },
        crude_oil: { values: [], min: 0, max: 0, mean: 0, stdDev: 0 }
    };
    
    // Collect values
    ['gold_silver_ratio', 'india_vix', 'market_cap_gdp_ratio', 'dxy', 'crude_oil'].forEach(field => {
        stats[field].values = data.map(d => d[field]).filter(v => v != null);
        if (stats[field].values.length > 0) {
            stats[field].min = Math.min(...stats[field].values);
            stats[field].max = Math.max(...stats[field].values);
            stats[field].mean = stats[field].values.reduce((a, b) => a + b, 0) / stats[field].values.length;
            
            // Calculate standard deviation
            const variance = stats[field].values.reduce((sum, val) => sum + Math.pow(val - stats[field].mean, 2), 0) / stats[field].values.length;
            stats[field].stdDev = Math.sqrt(variance);
            
            // Calculate moving averages
            if (stats[field].values.length >= 50) {
                stats[field].ma50 = stats[field].values.slice(0, 50).reduce((a, b) => a + b, 0) / 50;
            }
            if (stats[field].values.length >= 200) {
                stats[field].ma200 = stats[field].values.slice(0, 200).reduce((a, b) => a + b, 0) / 200;
            }
        }
    });
    
    return stats;
}

function getPercentileRank(value, data, field) {
    const values = data.map(d => d[field]).filter(v => v != null).sort((a, b) => a - b);
    // Count how many values are BELOW current value
    const belowCount = values.filter(v => v < value).length;
    // Percentile = (values below / total) * 100
    // So high values get high percentiles (95th, 100th) and low values get low percentiles (0th, 5th)
    return Math.round((belowCount / values.length) * 100);
}
